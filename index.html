/* Trocar texto num PDF é tapar o antigo e voltar a desenhá-lo. Só se faz quando o
   fundo é liso, e a letra usada diz-se sempre. Nada disto vai à internet. */

const EDITS = Object.create(null);      /* uid da página -> [objeto] */
let PE = null, FMET = null, GID = 0, OIDN = 0;

const STD = ["Helvetica","HelveticaBold","HelveticaOblique","HelveticaBoldOblique",
 "TimesRoman","TimesRomanBold","TimesRomanItalic","TimesRomanBoldItalic",
 "Courier","CourierBold","CourierOblique","CourierBoldOblique"];
const STDNM = { Helvetica:"Helvetica", HelveticaBold:"Helvetica Bold",
 HelveticaOblique:"Helvetica Oblique", HelveticaBoldOblique:"Helvetica Bold Oblique",
 TimesRoman:"Times Roman", TimesRomanBold:"Times Bold", TimesRomanItalic:"Times Italic",
 TimesRomanBoldItalic:"Times Bold Italic", Courier:"Courier", CourierBold:"Courier Bold",
 CourierOblique:"Courier Oblique", CourierBoldOblique:"Courier Bold Oblique" };
const PAL = [[26,31,39],[95,107,124],[31,111,235],[192,57,43],[30,135,75],[255,255,255]];

async function metrics(){
  if(FMET) return FMET;
  const doc = await PDFDoc.create(); const m = {};
  for(const k of STD) m[k] = await doc.embedFont(PDFLib.StandardFonts[k]);
  FMET = m; return FMET;
}
function famOf(k){
  const mono = k.indexOf("Courier")===0, serif = k.indexOf("Times")===0;
  return { family: mono ? "ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
                        : (serif ? "'Times New Roman',Times,serif" : "Helvetica,Arial,sans-serif"),
           weight: /Bold/.test(k) ? 700 : 400,
           style: /(Oblique|Italic)/.test(k) ? "italic" : "normal" };
}
function rgbCss(c){ return "rgb("+Math.round(c[0])+","+Math.round(c[1])+","+Math.round(c[2])+")"; }
function pdfRgb(c){ return PDFLib.rgb(c[0]/255, c[1]/255, c[2]/255); }
function alignCss(a){ return a==="c" ? "center" : (a==="r" ? "right" : "left"); }
function sameCol(a,b){ return a&&b&&a[0]===b[0]&&a[1]===b[1]&&a[2]===b[2]; }

function wrapText(f, size, text, maxW){
  const out = [];
  const paras = String(text==null?"":text).split("\n");
  for(const para of paras){
    const words = wa(para).split(/\s+/).filter(w=>w.length);
    if(!words.length){ out.push(""); continue; }
    let cur = words[0];
    for(let i=1;i<words.length;i++){
      const tryl = cur+" "+words[i];
      if(f.widthOfTextAtSize(tryl,size) <= maxW+0.02) cur = tryl;
      else { out.push(cur); cur = words[i]; }
    }
    out.push(cur);
  }
  return out;
}
/* escolhe a fonte padrão cuja largura se aproxima mais da largura observada */
function pickFont(cls, str, size, obsW){
  const pool = STD.filter(k => cls==="mono" ? k.indexOf("Courier")===0
    : (cls==="serif" ? k.indexOf("Times")===0 : k.indexOf("Helvetica")===0));
  let best = pool[0], bd = Infinity;
  const s = wa(str||"");
  if(!s.trim() || !obsW || !FMET) return best;
  for(const k of pool){
    const d = Math.abs(FMET[k].widthOfTextAtSize(s,size) - obsW);
    if(d < bd){ bd = d; best = k; }
  }
  return best;
}

/* ---- deteção de parágrafos, a partir das posições reais do texto ---- */
async function pageBlocks(d, idx){
  const page = await d.js.getPage(idx+1);
  const tc = await page.getTextContent();
  const st = tc.styles || {};
  const its = [];
  for(const it of tc.items){
    if(!it.str || !it.str.trim()) continue;
    const tr = it.transform;
    const size = Math.abs(tr[3]) || Math.abs(it.height) || 10;
    if(size < 1) continue;
    const fam = String(((st[it.fontName]||{}).fontFamily)||"").toLowerCase();
    const cls = fam.indexOf("mono")>=0 ? "mono"
      : ((fam.indexOf("serif")>=0 && fam.indexOf("sans")<0) ? "serif" : "sans");
    its.push({ x:tr[4], y:tr[5], w:it.width||0, size:size, s:it.str, cls:cls });
  }
  its.sort((a,b)=> (b.y-a.y) || (a.x-b.x));
  const lines = [];
  for(const it of its){
    let L = null;
    for(let i=lines.length-1; i>=0 && i>=lines.length-3; i--){
      if(Math.abs(lines[i].y - it.y) <= Math.max(1, it.size*0.3)){ L = lines[i]; break; }
    }
    if(L) L.its.push(it); else lines.push({ y:it.y, its:[it] });
  }
  for(const L of lines){
    L.its.sort((a,b)=>a.x-b.x);
    L.x0 = Math.min.apply(null, L.its.map(i=>i.x));
    L.x1 = Math.max.apply(null, L.its.map(i=>i.x+i.w));
    L.size = Math.max.apply(null, L.its.map(i=>i.size));
    L.cls = L.its[0].cls;
    let s = "";
    for(let i=0;i<L.its.length;i++){
      const it = L.its[i];
      if(i){
        const pv = L.its[i-1];
        if((it.x - (pv.x+pv.w)) > L.size*0.22 && !/\s$/.test(s)) s += " ";
      }
      s += it.s;
    }
    L.s = s.replace(/\s+/g," ").trim();
  }
  lines.sort((a,b)=> b.y - a.y);
  const blocks = [];
  for(const L of lines){
    if(!L.s) continue;
    const B = blocks.length ? blocks[blocks.length-1] : null;
    const gap = B ? (B.lastY - L.y) : 0;
    const ok = B
      && Math.abs(B.size - L.size) <= Math.max(0.6, B.size*0.12)
      && gap > 0 && gap <= B.size*2.1
      && (Math.min(B.x1,L.x1) - Math.max(B.x0,L.x0)) > -B.size
      && Math.abs(B.x0 - L.x0) <= B.size*3.2;
    if(ok){
      B.lines.push(L); B.lastY = L.y;
      B.x0 = Math.min(B.x0,L.x0); B.x1 = Math.max(B.x1,L.x1);
    } else {
      blocks.push({ lines:[L], x0:L.x0, x1:L.x1, y0:L.y, lastY:L.y, size:L.size, cls:L.cls });
    }
  }
  for(let i=0;i<blocks.length;i++){
    const B = blocks[i];
    B.id = "b"+i;
    B.text = B.lines.map(l=>l.s).join(" ").replace(/\s+/g," ").trim();
    B.top = B.y0 + B.size*0.80;
    B.bot = B.lastY - B.size*0.26;
    B.lh = B.lines.length>1 ? Math.max(1, (B.y0 - B.lastY)/((B.lines.length-1)*B.size)) : 1.2;
  }
  return { page:page, blocks: blocks.filter(b=>b.text.length>0) };
}

/* ---- o fundo é liso? qual é a cor do papel e a da tinta? ---- */
function sampleRect(ctx, r){
  const x = Math.max(0, Math.floor(r.x-2)), y = Math.max(0, Math.floor(r.y-2));
  const w = Math.min(ctx.canvas.width - x, Math.ceil(r.w+4));
  const hh = Math.min(ctx.canvas.height - y, Math.ceil(r.h+4));
  if(w<=1 || hh<=1) return null;
  let im;
  try{ im = ctx.getImageData(x,y,w,hh).data; }catch(e){ return null; }
  const cnt = new Map(); let dk = null, dv = 1e9;
  for(let i=0;i<im.length;i+=4){
    const R=im[i], G=im[i+1], B=im[i+2];
    const key = ((R>>3)<<10)|((G>>3)<<5)|(B>>3);
    cnt.set(key,(cnt.get(key)||0)+1);
    const lum = R*0.299 + G*0.587 + B*0.114;
    if(lum < dv){ dv = lum; dk = [R,G,B]; }
  }
  let bk = 0, bn = 0;
  cnt.forEach((n,k)=>{ if(n>bn){ bn=n; bk=k; } });
  const bg = [ ((bk>>10)&31)*8+4, ((bk>>5)&31)*8+4, (bk&31)*8+4 ];
  const total = im.length/4;
  let near = 0;
  for(let i=0;i<im.length;i+=4){
    if(Math.abs(im[i]-bg[0])<=14 && Math.abs(im[i+1]-bg[1])<=14 && Math.abs(im[i+2]-bg[2])<=14) near++;
  }
  return { bg:bg, ink:(dk||[0,0,0]), flat:(near/total) >= 0.55 };
}

/* ---- coordenadas ---- */
function toCv(x,y){ const q = PE.vp.convertToViewportPoint(x,y); return [q[0],q[1]]; }
function toPdf(cx,cy){ const q = PE.vp.convertToPdfPoint(cx,cy); return [q[0],q[1]]; }
function rectCv(x0,y0,x1,y1){
  const a = toCv(x0,y1), b = toCv(x1,y0);
  return { x:Math.min(a[0],b[0]), y:Math.min(a[1],b[1]),
           w:Math.abs(b[0]-a[0]), h:Math.abs(b[1]-a[1]) };
}
function rectPdf(r){
  const a = toPdf(r.x, r.y+r.h), b = toPdf(r.x+r.w, r.y);
  return { x:Math.min(a[0],b[0]), y:Math.min(a[1],b[1]),
           w:Math.abs(b[0]-a[0]), h:Math.abs(b[1]-a[1]) };
}
function textBox(o){
  const nl = Math.max(1, wrapText(FMET[o.font], o.size, o.text, o.w).length);
  const hpt = o.size*o.lh*(nl-1) + o.size*1.06;
  const top = (o.base!=null ? o.base : o.y) + o.size*0.80;
  return { x:o.x, y:top-hpt, w:o.w, h:hpt, nl:nl };
}
function objRect(o){
  if(o.k==="t"){ const b = textBox(o); return { x:b.x, y:b.y, w:b.w, h:b.h }; }
  if(o.k==="line"){
    return { x:Math.min(o.x1,o.x2), y:Math.min(o.y1,o.y2),
             w:Math.abs(o.x2-o.x1), h:Math.abs(o.y2-o.y1) };
  }
  return { x:o.x, y:o.y, w:o.w, h:o.h };
}
function objById(id){ const a = EDITS[PE.uid]||[]; for(const o of a) if(o.id===id) return o; return null; }
function blkById(id){ for(const b of PE.blocks) if(b.id===id) return b; return null; }
function blkTaken(id){ const a = EDITS[PE.uid]||[]; for(const o of a) if(o.k==="t" && o.blk===id) return true; return false; }

/* ---- abrir e fechar ---- */
async function openPE(i){
  const p = PAGES[i]; if(!p) return;
  const d = docById(p.doc); if(!d) return;
  progOn(tp("peLoad"));
  try{
    await metrics();
    const info = await pageBlocks(d, p.idx);
    if(!info.blocks.length){ progOff(); noTextModal(); return; }
    if(!EDITS[p.uid]) EDITS[p.uid] = [];
    PE = { i:i, uid:p.uid, p:p, d:d, page:info.page, blocks:info.blocks,
           tool:"text", sel:null, ed:null, scale:1, fit:"w", vp:null, ctx:null, task:null, warned:false };
    $("editor").classList.add("hidden");
    $("mbar").classList.add("hidden");
    $("pedit").classList.remove("hidden");
    peChrome();
    await peDraw(true);
  }catch(e){ console.error(e); toast(t("errBad",{f:d.name}),"err"); }
  progOff();
}
function closePE(){
  if(!PE) return;
  if(PE.ed) commitEdit();
  if(PE.task){ try{ PE.task.cancel(); }catch(e){} }
  PE = null;
  $("pedit").classList.add("hidden");
  $("peLayer").innerHTML = "";
  render();
}
function noTextModal(){
  const m = bigModal(t("bNoTextT"));
  m.body.innerHTML = '<div class="note w">'+t("bNoText")+'</div>';
  m.btn(t("peBack"),"g",m.close);
}

/* ---- desenho da página ---- */
async function peDraw(refit){
  if(!PE) return;
  const page = PE.page, p = PE.p;
  const rot = (((page.rotate + p.rot)%360)+360)%360;
  const base = page.getViewport({scale:1, rotation:rot});
  if(refit){
    const box = $("peScroll");
    const availW = Math.max(240, box.clientWidth - 34);
    const availH = Math.max(240, box.clientHeight - 34);
    PE.scale = PE.fit==="p" ? Math.min(availW/base.width, availH/base.height) : availW/base.width;
    PE.scale = Math.max(0.2, Math.min(4, PE.scale));
  }
  const vp = page.getViewport({scale:PE.scale, rotation:rot});
  PE.vp = vp;
  const cv = $("peCv");
  cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
  $("pePage").style.width = cv.width+"px";
  $("pePage").style.height = cv.height+"px";
  const cx = cv.getContext("2d");
  cx.fillStyle = "#fff"; cx.fillRect(0,0,cv.width,cv.height);
  PE.ctx = cx;
  if(PE.task){ try{ PE.task.cancel(); }catch(e){} }
  PE.task = page.render({ canvasContext:cx, viewport:vp });
  try{ await PE.task.promise; }catch(e){}
  PE.task = null; PE.ctx = cx;
  $("peZl").textContent = Math.round(PE.scale*100)+" %";
  peLayer(); peSide();
}

function peLayer(){
  if(!PE || !PE.vp) return;
  const L = $("peLayer");
  L.innerHTML = "";
  L.className = "pe-layer" + (PE.tool==="text" ? " tt" : "");
  L.style.cursor = (PE.tool==="new"||PE.tool==="cover"||PE.tool==="line"||PE.tool==="rect") ? "crosshair" : "default";
  if(PE.tool==="text"){
    for(const b of PE.blocks){
      if(blkTaken(b.id)) continue;
      const r = rectCv(b.x0, b.bot, b.x1, b.top);
      const e = el("div","pe-blk");
      e.style.cssText = "left:"+r.x+"px;top:"+r.y+"px;width:"+r.w+"px;height:"+r.h+"px";
      e.dataset.blk = b.id;
      L.appendChild(e);
    }
  }
  const objs = EDITS[PE.uid]||[];
  const selO = (PE.sel && PE.sel.kind==="obj") ? PE.sel.o : null;
  for(const o of objs){
    const e = objEl(o);
    e.dataset.oid = o.id;
    e.style.pointerEvents = (PE.tool==="sel" || (PE.tool==="text" && o.k==="t")) ? "auto" : "none";
    if(o===selO) e.classList.add("on");
    L.appendChild(e);
  }
  if(selO && PE.tool==="sel" && !PE.ed) handlesFor(selO, L);
}

function objEl(o){
  const e = el("div","pe-ob");
  if(o.k==="line"){
    const a = toCv(o.x1,o.y1), b = toCv(o.x2,o.y2);
    const x = Math.min(a[0],b[0])-5, y = Math.min(a[1],b[1])-5;
    const w = Math.abs(b[0]-a[0])+10, hh = Math.abs(b[1]-a[1])+10;
    e.style.cssText = "left:"+x+"px;top:"+y+"px;width:"+w+"px;height:"+hh+"px";
    e.innerHTML = '<svg width="'+w+'" height="'+hh+'" style="display:block">'
      + '<line x1="'+(a[0]-x)+'" y1="'+(a[1]-y)+'" x2="'+(b[0]-x)+'" y2="'+(b[1]-y)
      + '" stroke="'+rgbCss(o.color)+'" stroke-width="'+Math.max(1,o.lw*PE.scale)+'" stroke-linecap="round"></line></svg>';
    return e;
  }
  const rr = objRect(o);
  const r = rectCv(rr.x, rr.y, rr.x+rr.w, rr.y+rr.h);
  let css = "left:"+r.x+"px;top:"+r.y+"px;width:"+r.w+"px;height:"+r.h+"px;";
  if(o.k==="patch") css += "background:"+rgbCss(o.color)+";";
  if(o.k==="rect"){
    css += "border:"+Math.max(1,o.lw*PE.scale)+"px solid "+rgbCss(o.color)+";";
    if(o.fill) css += "background:"+rgbCss(o.fill)+";";
  }
  if(o.k==="img") css += "overflow:hidden;";
  if(o.k==="t"){
    const f = famOf(o.font);
    const fs = o.size*PE.scale, lh = o.size*o.lh*PE.scale;
    const pad = (0.80*fs) - ((lh - fs)/2 + 0.75*fs);
    css += "font-family:"+f.family+";font-weight:"+f.weight+";font-style:"+f.style
        +  ";color:"+rgbCss(o.color)+";font-size:"+fs+"px;line-height:"+lh
        +  "px;text-align:"+alignCss(o.align)+";white-space:pre-wrap;padding-top:"+pad+"px;overflow:visible;";
  }
  e.style.cssText = css;
  if(o.k==="img"){
    const im = new Image(); im.src = o.url; im.alt="";
    im.style.cssText = "width:100%;height:100%;display:block";
    e.appendChild(im);
  }
  if(o.k==="t") e.textContent = wrapText(FMET[o.font], o.size, o.text, o.w).join("\n");
  return e;
}

function handlesFor(o, L){
  const mk = (cx,cy,hd)=>{
    const d = el("div","pe-h");
    d.style.cssText = "left:"+(cx-4)+"px;top:"+(cy-4)+"px;cursor:"+(hd==="r"?"ew-resize":"nwse-resize");
    d.dataset.hd = hd; L.appendChild(d);
  };
  if(o.k==="line"){
    const a = toCv(o.x1,o.y1), b = toCv(o.x2,o.y2);
    mk(a[0],a[1],"p1"); mk(b[0],b[1],"p2");
    return;
  }
  const rr = objRect(o);
  const r = rectCv(rr.x, rr.y, rr.x+rr.w, rr.y+rr.h);
  if(o.k==="t"){ mk(r.x+r.w, r.y+r.h/2, "r"); return; }
  mk(r.x+r.w, r.y+r.h, "br");
}

    S.querySelectorAll("[data-al]").forEach(b=>{ b.onclick = ()=>{ o.align = b.dataset.al; pushHist(); peLayer(); peSide(); }; });
    S.querySelectorAll("[data-nm]").forEach(b=>{ b.onclick = ()=>{

    }; });
    if($("peRst")) $("peRst").onclick = peReset;
    $("peDel").onclick = peDel;
    return;
  }
  if(o){
    const isImg = o.k==="img", isLine = o.k==="line", isRect = o.k==="rect";

    let html = '<h4>'+esc(title)+'</h4><div class="pe-meta">'+esc(hintFor("sel"))+'</div>';
    if(!isImg) html += fld(t("sColor"), swatches(PAL, o.color, "col"));
    if(isLine || isRect) html += fld(t("sThick"), numBox("peLw", o.lw.toFixed(1).replace(".",",")+" pt"));
    if(isRect) html += fld(t("sFill"), '<label class="chk"><input type="checkbox" id="peFill"'+(o.fill?" checked":"")+'> '+esc(t("sNoFill"))+'</label>');

    S.querySelectorAll("[data-nm]").forEach(b=>{ b.onclick = ()=>{

/* ---- escrever ---- */
function pickBlock(b){
  if(!b) return;
  if(PE.ed) commitEdit();
  const r = rectCv(b.x0, b.bot, b.x1, b.top);
  const smp = sampleRect(PE.ctx, r);
  if(!smp || !smp.flat){ PE.sel = { kind:"blkNo", b:b }; peLayer(); peSide(); return; }
  const L0 = b.lines[0];
  const fk = pickFont(b.cls, L0.s, b.size, L0.x1 - L0.x0);
  PE.sel = { kind:"blk", b:b, smp:smp, font:fk };
  peLayer(); peSide();
  startEdit();
}
function startEdit(){
  const s = PE.sel; if(!s) return;
  if(PE.ed){ PE.ed.el.remove(); PE.ed = null; }
  let r, size, lh, fk, col, txt, align, bg;
  if(s.kind==="blk"){
    r = rectCv(s.b.x0, s.b.bot, s.b.x1, s.b.top);
    size = s.b.size; lh = s.b.lh; fk = s.font; col = s.smp.ink;
    txt = s.b.text; align = "l"; bg = rgbCss(s.smp.bg);
  } else if(s.kind==="obj" && s.o.k==="t"){
    const o = s.o, rr = objRect(o);
    r = rectCv(rr.x, rr.y, rr.x+rr.w, rr.y+rr.h);
    size = o.size; lh = o.lh; fk = o.font; col = o.color; txt = o.text; align = o.align;
    bg = o.patchBg ? rgbCss(o.patchBg) : "transparent";
  } else return;
  const f = famOf(fk);
  const fs = size*PE.scale, lhp = size*lh*PE.scale;
  const pad = (0.80*fs) - ((lhp - fs)/2 + 0.75*fs);
  const d = el("div","pe-ed");
  d.contentEditable = "true";
  d.spellcheck = false;
  d.style.cssText = "left:"+r.x+"px;top:"+r.y+"px;width:"+r.w+"px;min-height:"+r.h+"px;"
    + "font-family:"+f.family+";font-weight:"+f.weight+";font-style:"+f.style
    + ";color:"+rgbCss(col)+";font-size:"+fs+"px;line-height:"+lhp+"px;text-align:"+alignCss(align)
    + ";background:"+bg+";white-space:pre-wrap;padding-top:"+pad+"px";
  d.textContent = txt;
  $("peLayer").appendChild(d);
  PE.ed = { el:d, kind:s.kind };
  d.focus();
  try{
    const rg = document.createRange(); rg.selectNodeContents(d);
    const sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(rg);
  }catch(e){}
}
function cancelEdit(){
  if(!PE || !PE.ed) return;
  PE.ed.el.remove(); PE.ed = null;
  if(PE.sel && PE.sel.kind==="blk") PE.sel = null;
  peLayer(); peSide();
}
function commitEdit(){
  if(!PE || !PE.ed) return;
  const txt = String(PE.ed.el.innerText||"").replace(/\u00a0/g," ").replace(/\n{3,}/g,"\n\n").trim();
  const s = PE.sel;
  PE.ed.el.remove(); PE.ed = null;
  const objs = EDITS[PE.uid];
  if(s && s.kind==="blk"){
    const b = s.b;
    if(!txt || txt===b.text){ PE.sel = null; peLayer(); peSide(); return; }
    const g = "g"+(++GID);
    objs.push({ id:"o"+(++OIDN), g:g, k:"patch", x:b.x0-1, y:b.bot-1,
                w:(b.x1-b.x0)+2, h:(b.top-b.bot)+2, color:s.smp.bg });
    const o = { id:"o"+(++OIDN), g:g, k:"t", blk:b.id, orig:b.text, sub:true,
                x:b.x0, base:b.y0, w:(b.x1-b.x0), size:b.size, lh:b.lh, align:"l",
                font:s.font, color:s.smp.ink, text:txt, patchBg:s.smp.bg };
    objs.push(o);
    PE.sel = { kind:"obj", o:o };
    warnWide(o, (b.top-b.bot));
    pushHist();
  } else if(s && s.kind==="obj" && s.o.k==="t"){
    const o = s.o;
    if(!txt){ peDel(); return; }
    if(txt!==o.text){ o.text = txt; pushHist(); if(o.blk) warnWide(o, null); }
  }
  peLayer(); peSide();
}
function warnWide(o, hOrig){
  const b = textBox(o);
  const lim = hOrig!=null ? hOrig : b.h;
  if(b.h > lim + o.size*0.3 && !PE.warned){ PE.warned = true; toast(t("bWide"),"warn"); }
}
function peDel(){
  const s = PE.sel; if(!s || s.kind!=="obj") return;
  const objs = EDITS[PE.uid];
  const i = objs.indexOf(s.o);
  if(i>=0) objs.splice(i,1);
  PE.sel = null; pushHist(); peLayer(); peSide();
}
function peReset(){
  const s = PE.sel; if(!s || s.kind!=="obj" || !s.o.g) return;
  const g = s.o.g;
  EDITS[PE.uid] = (EDITS[PE.uid]||[]).filter(o=>o.g!==g);
  PE.sel = null; pushHist(); peLayer(); peSide();
}

/* ---- rato: mover, redimensionar, desenhar ---- */
function peDown(e){
  if(!PE || e.button!==0) return;
  const L = $("peLayer");
  const box = L.getBoundingClientRect();
  const px = e.clientX - box.left, py = e.clientY - box.top;
  const hd = e.target.closest(".pe-h");
  if(hd && PE.sel && PE.sel.kind==="obj"){ e.preventDefault(); dragStart(px,py,"h",hd.dataset.hd); return; }
  if(PE.ed && e.target.closest(".pe-ed")) return;
  if(PE.ed) commitEdit();
  const ob = e.target.closest(".pe-ob");
  if(ob && ob.dataset.oid){
    const o = objById(ob.dataset.oid);
    if(o){
      PE.sel = { kind:"obj", o:o };
      if(PE.tool==="text" && o.k==="t"){ peLayer(); peSide(); startEdit(); return; }
      e.preventDefault(); peLayer(); peSide(); dragStart(px,py,"move",null); return;
    }
  }
  const bk = e.target.closest(".pe-blk");
  if(bk && PE.tool==="text"){ e.preventDefault(); pickBlock(blkById(bk.dataset.blk)); return; }
  if(PE.tool==="new"||PE.tool==="cover"||PE.tool==="line"||PE.tool==="rect"){
    e.preventDefault(); dragStart(px,py,"draw",PE.tool); return;
  }
  PE.sel = null; peLayer(); peSide();
}
function dragStart(px,py,mode,arg){
  const L = $("peLayer");
  const box = L.getBoundingClientRect();
  const st = { px:px, py:py, mode:mode, arg:arg, o:(PE.sel&&PE.sel.kind==="obj")?PE.sel.o:null, moved:false };
  st.p0 = toPdf(px,py);
  if(st.o) st.snap = Object.assign({},st.o);
  let ghost = null;
  if(mode==="draw"){
    ghost = el("div","pe-ghost");
    ghost.style.cssText = "left:"+px+"px;top:"+py+"px;width:0;height:0";
    L.appendChild(ghost);
  }
  const move = ev=>{
    const cx = ev.clientX - box.left, cy = ev.clientY - box.top;
    st.moved = true;
    if(mode==="draw"){
      if(arg==="line"){
        ghost.style.cssText = "left:"+Math.min(px,cx)+"px;top:"+Math.min(py,cy)
          + "px;width:"+Math.abs(cx-px)+"px;height:"+Math.abs(cy-py)+"px";
      } else {
        ghost.style.cssText = "left:"+Math.min(px,cx)+"px;top:"+Math.min(py,cy)
          + "px;width:"+Math.abs(cx-px)+"px;height:"+Math.abs(cy-py)+"px";
      }
      return;
    }
    const p1 = toPdf(cx,cy);
    const dx = p1[0]-st.p0[0], dy = p1[1]-st.p0[1];
    const o = st.o; if(!o) return;
    if(mode==="move"){
      if(o.k==="line"){ o.x1 = st.snap.x1+dx; o.y1 = st.snap.y1+dy; o.x2 = st.snap.x2+dx; o.y2 = st.snap.y2+dy; }
      else if(o.k==="t"){ o.x = st.snap.x+dx; o.base = st.snap.base+dy; }
      else { o.x = st.snap.x+dx; o.y = st.snap.y+dy; }
    } else if(mode==="h"){
      if(arg==="p1"){ o.x1 = st.snap.x1+dx; o.y1 = st.snap.y1+dy; }
      else if(arg==="p2"){ o.x2 = st.snap.x2+dx; o.y2 = st.snap.y2+dy; }
      else if(arg==="r"){ o.w = Math.max(o.size*1.2, st.snap.w+dx); }
      else { o.w = Math.max(3, st.snap.w+dx); o.h = Math.max(3, st.snap.h-dy); o.y = st.snap.y+dy; }
    }
    peLayer();
  };
  const up = ev=>{
    window.removeEventListener("pointermove",move);
    window.removeEventListener("pointerup",up);
    if(mode==="draw"){
      const cx = ev.clientX - box.left, cy = ev.clientY - box.top;
      if(ghost) ghost.remove();
      finishDraw(arg, px, py, cx, cy);
      return;
    }
    if(st.moved) pushHist();
    peLayer(); peSide();
  };
  window.addEventListener("pointermove",move);
  window.addEventListener("pointerup",up);
}
function finishDraw(tool, x0, y0, x1, y1){
  const objs = EDITS[PE.uid];
  if(tool==="line"){
    const a = toPdf(x0,y0), b = toPdf(x1,y1);
    if(Math.abs(x1-x0)+Math.abs(y1-y0) < 6){ peLayer(); peSide(); return; }
    const o = { id:"o"+(++OIDN), k:"line", x1:a[0], y1:a[1], x2:b[0], y2:b[1], lw:1, color:PAL[0] };
    objs.push(o); PE.sel = { kind:"obj", o:o }; pushHist(); peLayer(); peSide(); return;
  }
  const r = { x:Math.min(x0,x1), y:Math.min(y0,y1), w:Math.abs(x1-x0), h:Math.abs(y1-y0) };
  if(r.w < 6 || r.h < 6){ peLayer(); peSide(); return; }
  const pr = rectPdf(r);
  if(tool==="cover"){
    const smp = sampleRect(PE.ctx, r);
    const o = { id:"o"+(++OIDN), k:"patch", x:pr.x, y:pr.y, w:pr.w, h:pr.h,
                color:(smp&&smp.flat)?smp.bg:PAL[0] };
    objs.push(o); PE.sel = { kind:"obj", o:o }; PE.tool = "sel";
    pushHist(); peChrome(); peLayer(); peSide(); return;
  }
  if(tool==="rect"){
    const o = { id:"o"+(++OIDN), k:"rect", x:pr.x, y:pr.y, w:pr.w, h:pr.h, lw:1, color:PAL[0], fill:null };
    objs.push(o); PE.sel = { kind:"obj", o:o }; pushHist(); peLayer(); peSide(); return;
  }
  if(tool==="new"){
    const size = Math.max(6, Math.min(48, Math.round(pr.h*0.62*10)/10)) || 11;
    const o = { id:"o"+(++OIDN), k:"t", x:pr.x, base:pr.y+pr.h-size*0.80, w:pr.w,
                size:size, lh:1.25, align:"l", font:"Helvetica", color:PAL[0], text:"" };
    objs.push(o); PE.sel = { kind:"obj", o:o };
    peLayer(); peSide(); startEdit(); return;
  }
}
async function peImgPick(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f || !PE) return;
  try{
    const buf = new Uint8Array(await f.arrayBuffer());
    const isPng = buf[0]===0x89 && buf[1]===0x50;
    const isJpg = buf[0]===0xFF && buf[1]===0xD8;
    if(!isPng && !isJpg){ toast(t("errImg"),"err"); return; }
    const url = URL.createObjectURL(new Blob([buf],{type:isPng?"image/png":"image/jpeg"}));
    const im = new Image();
    await new Promise((res,rej)=>{ im.onload=res; im.onerror=rej; im.src=url; });
    const cw = PE.vp.width*0.35, ch = cw*(im.height/im.width);
    const pr = rectPdf({ x:(PE.vp.width-cw)/2, y:(PE.vp.height-ch)/2, w:cw, h:ch });
    const o = { id:"o"+(++OIDN), k:"img", x:pr.x, y:pr.y, w:pr.w, h:pr.h,
                data:buf, type:isPng?"png":"jpg", url:url };
    EDITS[PE.uid].push(o);
    PE.sel = { kind:"obj", o:o }; PE.tool = "sel";
    pushHist(); peChrome(); peLayer(); peSide();
  }catch(err){ console.error(err); toast(t("errImg"),"err"); }
}

/* ---- barra e ligações ---- */
function peChrome(){
  if(!PE) return;
  $("peDot").style.background = PE.d.color;
  $("peName").textContent = PE.d.name;
  $("peName").title = PE.d.name;
  $("peWhich").textContent = tp("peWhich",{n:PE.i+1,m:PAGES.length});
  $("peUndo").innerHTML = IC.undo; $("peUndo").title = tp("undoT");
  $("peRedo").innerHTML = IC.redo; $("peRedo").title = tp("redoT");
  $("peUndo").disabled = HPOS<=0;
  $("peRedo").disabled = HPOS>=HIST.length-1;
  const rail = $("peRail"); rail.innerHTML = "";
  const tools = [["sel",IC.cursor,"tSel"],["text",IC.pen,"tText"],["new",IC.tnew,"tNew"],
                 ["cover",IC.cover,"tCover"],["img",IC.image,"tImg"],["line",IC.linei,"tLine"],
                 ["rect",IC.recti,"tRect"]];
  for(const tl of tools){
    const b = el("button","pe-tool"+(PE.tool===tl[0]?" on":""), tl[1]);
    b.title = tp(tl[2]);
    b.onclick = ()=>{
      if(PE.ed) commitEdit();
      PE.sel = null;
      if(tl[0]==="img"){ $("peFile").click(); }
      else PE.tool = tl[0];
      peChrome(); peLayer(); peSide();
    };
    rail.appendChild(b);
    if(tl[0]==="text" || tl[0]==="cover"){
      const sp = el("div");
      sp.style.cssText = "width:23px;height:1px;background:var(--line);margin:5px 0;flex:0 0 auto";
      rail.appendChild(sp);
    }
  }
}
async function peDownload(){
  if(!PE) return;
  if(PE.ed) commitEdit();
  progOn(tp("wSave"));
  try{
    const bytes = await buildPdf([PE.p], tp("wSave"));
    const name = baseName(PE.d.name)+"-pagina-"+(PE.i+1)+".pdf";
    dl(new Blob([bytes],{type:"application/pdf"}), name);
    toast(t("okSaved",{f:name}),"ok");
  }catch(err){ console.error(err); toast(t("errBad",{f:"PDF"}),"err"); }
  progOff();
}
function peInit(){
  $("peLayer").addEventListener("pointerdown", peDown);
  $("peBack").onclick = closePE;
  $("peApply").onclick = ()=>{ const n = PE ? PE.i+1 : 0; closePE(); toast(t("peOk",{n:n}),"ok"); };
  $("peDl").onclick = peDownload;
  $("peUndo").onclick = ()=>{ if(PE&&PE.ed) commitEdit(); undo(); if(PE) peChrome(); };
  $("peRedo").onclick = ()=>{ if(PE&&PE.ed) commitEdit(); redo(); if(PE) peChrome(); };
  $("peZi").onclick = ()=>{ if(!PE) return; PE.scale = Math.min(4, PE.scale*1.15); peDraw(false); };
  $("peZo").onclick = ()=>{ if(!PE) return; PE.scale = Math.max(0.2, PE.scale/1.15); peDraw(false); };
  $("peFw").onclick = ()=>{ if(!PE) return; PE.fit="w"; $("peFw").classList.add("on"); $("peFp").classList.remove("on"); peDraw(true); };
  $("peFp").onclick = ()=>{ if(!PE) return; PE.fit="p"; $("peFp").classList.add("on"); $("peFw").classList.remove("on"); peDraw(true); };
  $("peFile").onchange = peImgPick;
  $("grid").addEventListener("dblclick", e=>{
    const c = e.target.closest(".pg"); if(!c) return;
    const i = idxOf(c.dataset.uid); if(i>=0) openPE(i);
  });
  let rz = null;
  window.addEventListener("resize", ()=>{
    if(!PE) return;
    clearTimeout(rz); rz = setTimeout(()=>{ if(PE) peDraw(true); }, 180);
  });
}

/* ---- escrever as edições no PDF ---- */
async function fontIn(out, key, cache){
  if(cache[key]) return cache[key];
  cache[key] = await out.embedFont(PDFLib.StandardFonts[key]);
  return cache[key];
}
async function drawEdits(out, pg, p, fcache){
  const objs = EDITS[p.uid];
  if(!objs || !objs.length) return;
  for(const o of objs){
    try{
      if(o.k==="patch"){
        pg.drawRectangle({ x:o.x, y:o.y, width:o.w, height:o.h, color:pdfRgb(o.color) });
      } else if(o.k==="rect"){
        const opt = { x:o.x, y:o.y, width:o.w, height:o.h, borderColor:pdfRgb(o.color), borderWidth:o.lw };
        if(o.fill) opt.color = pdfRgb(o.fill);
        pg.drawRectangle(opt);
      } else if(o.k==="line"){
        pg.drawLine({ start:{x:o.x1,y:o.y1}, end:{x:o.x2,y:o.y2}, thickness:o.lw, color:pdfRgb(o.color) });
      } else if(o.k==="img"){
        const im = (o.type==="png") ? await out.embedPng(o.data) : await out.embedJpg(o.data);
        pg.drawImage(im, { x:o.x, y:o.y, width:o.w, height:o.h });
      } else if(o.k==="t"){
        const f = await fontIn(out, o.font, fcache);
        const lines = wrapText(FMET[o.font], o.size, o.text, o.w);
        let ty = (o.base!=null) ? o.base : (o.y + o.h - o.size*0.80);
        for(const ln of lines){
          const s = wa(ln);
          if(s){
            let tx = o.x;
            if(o.align==="c" || o.align==="r"){
              const lw = FMET[o.font].widthOfTextAtSize(s, o.size);
              tx = (o.align==="c") ? o.x + (o.w-lw)/2 : o.x + o.w - lw;
            }
            pg.drawText(s, { x:tx, y:ty, size:o.size, font:f, color:pdfRgb(o.color) });
          }
          ty -= o.size*o.lh;
        }
      }
    }catch(e){ console.error("edição não desenhada", o.k, e); }
  }
}
