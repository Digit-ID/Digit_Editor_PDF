  /* ---------- barra superior ---------- */

    padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .brand img{height:30px;width:auto;display:block}
  .brand .nm{display:flex;flex-direction:column;line-height:1.15;min-width:0}
  .brand .nm b{font-family:var(--f-ti);font-size:17px;font-weight:600;white-space:nowrap}
  .brand .nm span{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint);font-weight:700}
  .top-sp{flex:1}
  .top-acts{display:flex;align-items:center;gap:7px}

  /* ---------- botões ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 13px;
    border:1px solid transparent;border-radius:var(--r-btn);background:var(--brand);color:var(--brand-ink);
    font-family:var(--f-ui);font-size:13px;font-weight:600;cursor:pointer;transition:.14s;white-space:nowrap}
  .btn:hover{background:var(--brand-dark)}
  .btn.g{background:var(--card);color:var(--ink);border-color:var(--line)}
  .btn.g:hover{background:var(--chip)}
  .btn.q{background:transparent;color:var(--muted);border-color:transparent}
  .btn.q:hover{background:var(--chip);color:var(--ink)}
  .btn.ic{width:36px;padding:0}
  .btn.sm{height:31px;padding:0 10px;font-size:12px}
  .btn.dz{background:var(--err);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn:disabled:hover{background:var(--brand)}
  .btn.g:disabled:hover{background:var(--card)}

  .segs{display:flex;gap:3px;background:var(--chip);border-radius:var(--r-chip);padding:3px}
  .seg{border:none;background:transparent;padding:5px 9px;border-radius:7px;font-family:var(--f-ui);
    font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:.14s}
  .seg:hover{background:var(--hover);color:var(--ink)}
  .seg.on{background:var(--brand);color:var(--brand-ink)}

  /* ---------- privacidade ---------- */
  .priv{display:flex;align-items:center;gap:9px;margin:0 0 14px;padding:10px 14px;
    background:var(--ok-bg);border:1px solid color-mix(in srgb,var(--ok) 25%,transparent);
    border-radius:var(--r-chip);font-size:12.5px;font-weight:600;color:var(--ok)}
  .priv svg{color:var(--ok)}

  /* ---------- layout ---------- */
  .wrap{max-width:1360px;margin:0 auto;padding:16px 18px 30px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sh)}
  .pad{padding:16px}
  h2.sec{margin:0 0 4px;font-size:18px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px}

  /* ---------- zona de arrasto ---------- */
  .drop{border:2px dashed color-mix(in srgb,var(--brand) 45%,var(--line));border-radius:var(--r-card);
    padding:38px 22px;text-align:center;cursor:pointer;background:var(--card);transition:.15s}
  .drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
  .drop .ico{color:var(--brand);margin-bottom:10px}
  .drop .t1{font-size:16px;font-family:var(--f-ti);font-weight:600}
  .drop .t1 b{color:var(--brand)}
  .drop .t2{font-size:12.5px;color:var(--muted);margin-top:6px}
  .quick{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:16px}

  /* ---------- barra de ações ---------- */
  .bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 14px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
    box-shadow:var(--sh);margin-bottom:12px;position:sticky;top:57px;z-index:40}
  .bar .sp{flex:1}
  .bar .divi{width:1px;height:24px;background:var(--line);margin:0 3px}
  .selinfo{font-size:12.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);
    padding:5px 10px;border-radius:8px;white-space:nowrap}

  /* ---------- documentos ---------- */
  .docs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .docchip{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r-chip);font-size:12.5px;box-shadow:var(--sh)}
  .docchip .dn{font-weight:600;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .docchip .dp{color:var(--faint);font-family:var(--f-num);font-size:11.5px}
  .docchip .dcol{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .minibtn{border:none;background:transparent;color:var(--muted);cursor:pointer;padding:3px;
    border-radius:6px;display:inline-flex}
  .minibtn:hover{background:var(--chip);color:var(--ink)}

  /* ---------- grelha de páginas ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
  .pg{position:relative;background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:8px;cursor:pointer;transition:.12s;user-select:none;box-shadow:var(--sh)}
  .pg:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
  .pg.sel{border-color:var(--sel);background:var(--sel-bg);box-shadow:0 0 0 2px color-mix(in srgb,var(--sel) 28%,transparent)}
  .pg.drag{opacity:.4}
  .pg.dropbefore{box-shadow:-3px 0 0 0 var(--brand)}
  .pg.dropafter{box-shadow:3px 0 0 0 var(--brand)}
  .thumb{position:relative;width:100%;aspect-ratio:1/1.35;display:flex;align-items:center;justify-content:center;
    background:var(--line2);border-radius:7px;overflow:hidden}
  .thumb canvas,.thumb img{max-width:100%;max-height:100%;display:block;
    box-shadow:0 1px 4px rgba(17,26,39,.14);background:#fff;transition:transform .18s ease}
  .thumb .ld{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--brand);
    border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .pgfoot{display:flex;align-items:center;gap:5px;margin-top:7px}
  .pgnum{font-family:var(--f-num);font-size:11.5px;font-weight:700;color:var(--muted)}
  .pgsrc{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
  .pgacts{margin-left:auto;display:flex;gap:1px}
  .pgacts .minibtn{padding:4px}
  .pgtick{position:absolute;top:12px;left:12px;width:19px;height:19px;border-radius:6px;
    border:1.5px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;
    color:transparent}
  .pg.sel .pgtick{background:var(--sel);border-color:var(--sel);color:#fff}
  .pgrot{position:absolute;top:12px;right:12px;font-family:var(--f-num);font-size:10px;font-weight:700;
    background:var(--brand);color:var(--brand-ink);padding:2px 5px;border-radius:5px}

  .pgerr{font-family:var(--f-num);font-weight:700;color:var(--err)}
  .bi{display:inline-flex;align-items:center;justify-content:center}

  /* ---------- lista de ferramentas ---------- */
  .toolrow{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;margin-bottom:8px;
    padding:12px 13px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--card);
    color:var(--ink);font-family:var(--f-ui);font-size:13px;cursor:pointer;transition:.14s}
  .toolrow:hover{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));background:var(--brand-soft)}
  .toolrow .ti{color:var(--brand);display:inline-flex;margin-top:1px}
  .toolrow .tt{display:flex;flex-direction:column;gap:2px;min-width:0}
  .toolrow .tt b{font-weight:700}
  .toolrow .tt span{color:var(--muted);font-size:12px}

  /* ---------- ajuda ---------- */
  .hh{font-family:var(--f-ti);font-size:15px;font-weight:600;margin:18px 0 6px}
  .hh:first-child{margin-top:0}
  .hp{font-size:13px;color:var(--ink);margin:0 0 8px;text-align:justify;line-height:1.62}
  .hp b{font-weight:700}
  kbd{font-family:var(--f-num);font-size:11px;background:var(--chip);border:1px solid var(--line);
    border-bottom-width:2px;border-radius:5px;padding:1px 5px;white-space:nowrap}

  /* ---------- modais ---------- */
  .ov{position:fixed;inset:0;background:rgba(10,16,26,.5);backdrop-filter:blur(2px);z-index:200;
    display:flex;align-items:center;justify-content:center;padding:18px}
  .ov.hidden{display:none !important}
  .mo{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--sh2);
    width:100%;max-width:520px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
  .mo.wide{max-width:900px}
  .mo-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
  .mo-h h3{margin:0;font-size:17px;flex:1}
  .mo-b{padding:18px;overflow:auto}
  .mo-f{display:flex;gap:8px;padding:14px 18px;border-top:1px solid var(--line);background:var(--card)}
  .mo-f .sp{flex:1}
  .x{border:none;background:var(--chip);width:31px;height:31px;border-radius:9px;cursor:pointer;
    color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
  .x:hover{background:var(--hover);color:var(--ink)}

  /* ---------- formulários ---------- */
  .fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .fld>label{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .inp{height:38px;padding:0 11px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--card);
    color:var(--ink);font-family:var(--f-ui);font-size:13.5px;width:100%}
  .inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  select.inp{cursor:pointer}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1 1 160px;min-width:0}
  .rad{display:flex;flex-direction:column;gap:7px}
  .rad label{display:flex;align-items:flex-start;gap:9px;padding:11px 12px;border:1px solid var(--line);
    border-radius:var(--r-btn);cursor:pointer;font-size:13px;transition:.14s}
  .rad label:hover{border-color:color-mix(in srgb,var(--brand) 40%,var(--line));background:var(--brand-soft)}
  .rad input{margin-top:2px;accent-color:var(--brand);width:16px;height:16px;flex:0 0 auto}
  .rad .rt{display:flex;flex-direction:column;gap:2px}
  .rad .rt b{font-weight:700}
  .rad .rt span{color:var(--muted);font-size:12px}
  .rad label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
  .chk{display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;font-weight:600}
  .chk input{accent-color:var(--brand);width:16px;height:16px}

  /* ---------- avisos ---------- */
  .note{border-radius:var(--r-chip);padding:11px 13px;font-size:12.5px;line-height:1.55;
    border:1px solid;margin-bottom:12px}
  .note.i{background:var(--brand-soft);border-color:color-mix(in srgb,var(--brand) 25%,transparent);color:var(--ink)}
  .note.w{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 28%,transparent);color:var(--warn)}
  .note.e{background:var(--err-bg);border-color:color-mix(in srgb,var(--err) 28%,transparent);color:var(--err)}
  .note.o{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 25%,transparent);color:var(--ok)}
  .note b{font-weight:700}

  /* ---------- progresso ---------- */
  .prog{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:300;
    background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);
    padding:13px 17px;min-width:290px;max-width:calc(100vw - 36px)}
  .prog.hidden{display:none !important}
  .prog .pt{font-size:12.5px;font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:center}
  .prog .pt .n{margin-left:auto;font-family:var(--f-num);color:var(--muted)}
  .track{height:5px;background:var(--chip);border-radius:5px;overflow:hidden}
  .track i{display:block;height:100%;background:var(--brand);border-radius:5px;width:0;transition:width .2s}

  /* ---------- toasts ---------- */
  .toasts{position:fixed;right:16px;bottom:16px;z-index:400;display:flex;flex-direction:column;gap:8px;
    max-width:min(380px,calc(100vw - 32px))}
  .toast{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--brand);
    border-radius:11px;box-shadow:var(--sh2);padding:11px 13px;font-size:12.8px;line-height:1.5;
    animation:tin .22s ease both}
  .toast.err{border-left-color:var(--err)} .toast.ok{border-left-color:var(--ok)}
  .toast.warn{border-left-color:var(--warn)}
  .toast b{display:block;margin-bottom:2px}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ---------- barra inferior (móvel) ---------- */
  .mbar{display:none}

  /* ---------- tabela de pré-visualização ---------- */
  .tbwrap{overflow:auto;max-height:52vh;border:1px solid var(--line);border-radius:var(--r-btn)}
  table.pv{border-collapse:collapse;width:100%;font-size:12.5px;white-space:nowrap}
  table.pv th,table.pv td{border:1px solid var(--line);padding:5px 8px;text-align:left}
  table.pv thead th{position:sticky;top:0;background:var(--chip);font-weight:700;z-index:1}
  table.pv tr.head td{background:var(--brand-soft);font-weight:700}
  table.pv tr.off td{opacity:.35;text-decoration:line-through}
  table.pv td.num{text-align:right;font-family:var(--f-num)}
  .colhdr{display:flex;gap:4px;align-items:center}


  /* ---------- editor de página ---------- */
  .pe-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px;background:var(--card);
    border:1px solid var(--line);border-radius:var(--r-card) var(--r-card) 0 0;box-shadow:var(--sh)}
  .pe-main{display:flex;align-items:stretch;min-height:520px;background:var(--card);border:1px solid var(--line);
    border-top:0;border-radius:0 0 var(--r-card) var(--r-card);overflow:hidden}
  .pe-rail{width:53px;flex:0 0 auto;border-right:1px solid var(--line);display:flex;flex-direction:column;
    align-items:center;gap:4px;padding:10px 0}
  .pe-tool{width:35px;height:35px;border:1px solid transparent;border-radius:var(--r-btn);background:transparent;
    color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .pe-tool:hover{background:var(--chip);color:var(--ink)}
  .pe-tool.on{background:var(--brand);color:var(--brand-ink)}
  .pe-tool:disabled{opacity:.35;cursor:not-allowed}
  .pe-mid{flex:1;min-width:0;background:var(--line2);display:flex;flex-direction:column}
  .pe-scroll{flex:1;overflow:auto;padding:16px;display:flex;justify-content:center;align-items:flex-start}
  .pe-page{position:relative;background:#fff;box-shadow:0 2px 12px rgba(17,26,39,.22);flex:0 0 auto}
  .pe-page canvas{display:block}
  .pe-layer{position:absolute;inset:0}
  .pe-blk{position:absolute;border:1px dashed transparent;border-radius:2px;cursor:text}
  .pe-layer.tt .pe-blk{border-color:color-mix(in srgb,var(--brand) 22%,transparent)}
  .pe-layer.tt .pe-blk:hover{border-color:color-mix(in srgb,var(--brand) 60%,transparent);
    background:color-mix(in srgb,var(--brand) 7%,transparent)}
  .pe-ob{position:absolute}
  .pe-ob.on{outline:1.5px solid var(--sel);outline-offset:2px}
  .pe-ed{position:absolute;outline:1.5px solid var(--sel);padding:0;margin:0}
  .pe-ghost{position:absolute;border:1.5px solid var(--sel);background:color-mix(in srgb,var(--sel) 12%,transparent)}
  .pe-zoom{display:flex;align-items:center;gap:7px;padding:9px 12px;border-top:1px solid var(--line);background:var(--card)}
  .pe-side{width:302px;flex:0 0 auto;border-left:1px solid var(--line);padding:14px;overflow:auto;background:var(--card)}
  .pe-side h4{font-family:var(--f-ti);font-size:15px;font-weight:600;margin:0 0 2px}
  .pe-side .pe-meta{font-size:11.5px;color:var(--muted);margin-bottom:14px;line-height:1.5}
  .pe-side .pe-hint{font-size:11.5px;color:var(--faint);line-height:1.55}
  .pe-sw{display:flex;gap:7px;flex-wrap:wrap}
  .pe-sw button{width:34px;height:34px;border-radius:var(--r-chip);border:1px solid var(--line);cursor:pointer}
  .pe-sw button.on{border:2px solid var(--sel)}
  .pe-num{display:flex;align-items:center;height:38px;border:1px solid var(--line);border-radius:var(--r-btn);overflow:hidden}
  .pe-num button{border:none;background:transparent;color:var(--muted);width:32px;height:100%;cursor:pointer;
    font-family:var(--f-num);font-size:14px;font-weight:700}
  .pe-num button:hover{background:var(--chip);color:var(--ink)}
  .pe-num span{flex:1;text-align:center;font-family:var(--f-num);font-size:13px;font-weight:700}
  .pe-xy{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .pe-xy div{display:flex;align-items:center;gap:7px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-btn)}
  .pe-xy b{font-size:11px;color:var(--faint);font-weight:700}
  .pe-xy span{font-family:var(--f-num);font-size:12.5px}
  .pe-hr{height:1px;background:var(--line2);margin:14px 0}
  .pgedit{position:absolute;top:12px;left:37px;display:inline-flex;align-items:center;gap:3px;
    background:var(--ok);color:#fff;padding:2px 5px;border-radius:5px;font-family:var(--f-num);font-size:10px;font-weight:700}
  @media(max-width:820px){
    .pe-main{flex-direction:column;min-height:0}
    .pe-rail{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:8px 10px;overflow:auto}
    .pe-tool{width:40px;height:40px;flex:0 0 auto}
    .pe-side{width:auto;border-left:0;border-top:1px solid var(--line)}
    .pe-scroll{padding:10px}
    .pe-top{border-radius:var(--r-card);margin-bottom:10px}
    .pe-main{border-top:1px solid var(--line);border-radius:var(--r-card)}
  }

  /* ---------- responsivo ---------- */
  @media(max-width:820px){
    .wrap{padding:12px 11px 96px}
    .top{padding:9px 12px;gap:8px}
    .brand img{height:24px} .brand .nm b{font-size:15px} .brand .nm span{font-size:9px}
    .brand{gap:8px} .top-acts{gap:5px}
    /* estas ações já estão na barra inferior fixa */
    .bar #bSave,.bar #bDel,.bar #bMore{display:none}
    .btn{height:40px;min-width:40px} .btn.ic{width:40px}
    .seg{padding:7px 10px;min-height:34px}
    .bar{position:static;padding:10px}
    .bar .lbl{display:none}
    .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px}
    .pg{padding:6px}
    .mo{max-height:92vh} .mo-b{padding:14px}
    .prog{bottom:82px;left:11px;right:11px;transform:none;min-width:0;max-width:none}
    .toasts{right:11px;left:11px;bottom:82px;max-width:none}
    /* barra inferior fixa com as ações principais */
    .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:70;gap:6px;
      padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);
      border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(17,26,39,.07)}
    .mbar .btn{flex:1;height:46px;flex-direction:column;gap:2px;font-size:10.5px;padding:0 4px}
    .mbar .btn svg{width:19px;height:19px}
    .drop{padding:26px 14px}
  }
  @media(max-width:520px){
    .brand .nm span{display:none}
    .segs .seg{padding:7px 8px;font-size:11px}
    #bHelp span:not(.bi){display:none} #bHelp{width:40px;padding:0}
    .wrap{padding:10px 9px 96px}
    .priv{font-size:11.8px;padding:9px 11px}
  }
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <img id="logo" alt="Digit" src="">
    <div class="nm"><b>DigiPDF</b><span>Digit&nbsp;·&nbsp;I&amp;D</span></div>
  </div>
  <div class="top-sp"></div>
  <div class="top-acts">
    <button id="bTheme" class="btn g ic" title="Tema"></button>
    <div class="segs" id="langs">
      <button class="seg on" data-l="pt">PT</button>
      <button class="seg" data-l="en">EN</button>
      <button class="seg" data-l="es">ES</button>
    </div>
    <button id="bHelp" class="btn g" data-i18n="mHelp">Ajuda</button>
  </div>
</div>

<div class="wrap">

  <div class="priv" id="priv"></div>

  <!-- ===================== ESTADO VAZIO ===================== -->
  <section id="empty">
    <h2 class="sec" data-i18n="emptyT">Editor de PDF</h2>
    <p class="sub" data-i18n="emptyS">Junta, divide, roda e reorganiza páginas. Converte para Excel e Word. Tudo dentro do teu navegador.</p>
    <div class="drop" id="drop">
      <div class="ico" id="dropIco"></div>

function fmtBytes(b){

}

/* ---------------- 6. histórico (desfazer / refazer, sem limite) ---------------- */
function snap(){
  const e = {};
  for(const k in EDITS){ if((EDITS[k]||[]).length) e[k] = EDITS[k].map(o=>Object.assign({},o)); }
  return { p: PAGES.map(p=>({uid:p.uid,doc:p.doc,idx:p.idx,rot:p.rot})), s: Array.from(SEL), e: e };
}
function pushHist(){
  HIST = HIST.slice(0, HPOS+1);
  HIST.push(snap());
  HPOS = HIST.length-1;
  syncBar();
}
function applySnap(s){
  PAGES = s.p.map(p=>({uid:p.uid,doc:p.doc,idx:p.idx,rot:p.rot}));
  SEL = new Set(s.s.filter(u=>PAGES.some(p=>p.uid===u)));
  for(const k in EDITS) delete EDITS[k];
  for(const k in (s.e||{})) EDITS[k] = s.e[k].map(o=>Object.assign({},o));
  render();
  if(PE){ PE.sel=null; PE.ed=null; if(!EDITS[PE.uid]) EDITS[PE.uid]=[]; peLayer(); peSide(); }
}
function undo(){
  if(HPOS<=0){ toast(t("undoNo")); return; }
  HPOS--; applySnap(HIST[HPOS]); syncBar();
}
function redo(){
  if(HPOS>=HIST.length-1){ toast(t("redoNo")); return; }
  HPOS++; applySnap(HIST[HPOS]); syncBar();
}

/* ---------------- 7. abrir ficheiros ---------------- */
const MAXB = 50*1024*1024;

async function addFiles(list){
  const files = Array.from(list||[]);
  if(!files.length) return;
  const pdfs = [], others = [];
  for(const f of files){
    const n = f.name.toLowerCase();
    if(n.endsWith(".pdf")) pdfs.push(f);
    else others.push(f);
  }
  if(others.length){
    if(CONV && CONV.incoming) CONV.incoming(others);
    else toast(t("errNoPdf"),"warn");
  }
  if(!pdfs.length) return;

  progOn(t("wLoad",{f:pdfs[0].name}));
  let ok=0;
  for(let i=0;i<pdfs.length;i++){
    const f = pdfs[i];
    progSet(i, pdfs.length, t("wLoad",{f:f.name}));
    await paint();
    if(f.size > MAXB) toast(t("errBig",{f:f.name,s:fmtBytes(f.size)}),"warn");
    try{
      const buf = new Uint8Array(await f.arrayBuffer());
      /* pdf.js consome (transfere) o buffer: guardamos uma cópia para o pdf-lib */
      const keep = buf.slice(0);
      const js = await pdfjsLib.getDocument({data:buf, isEvalSupported:false}).promise;
      const d = { id:"d"+(++DID), name:f.name, size:f.size, bytes:keep, js:js, n:js.numPages,
                  color: COLORS[(DID-1)%COLORS.length] };
      DOCS.push(d);
      for(let p=0;p<d.n;p++) PAGES.push({uid:"u"+(++UID), doc:d.id, idx:p, rot:0});
      ok++;
    }catch(e){
      const nm = (e && e.name) || "";
      if(nm==="PasswordException" || /password/i.test(String(e && e.message))) toast(t("errPwd"),"err");
      else toast(t("errBad",{f:f.name}),"err");
    }
  }
  progOff();
  if(ok){
    pushHist();
    render();
    toast(t("okLoad",{n:ok}),"ok");
  }
}

/* ---------------- 8. miniaturas ---------------- */
function thumbKey(p){ return p.doc+":"+p.idx+":"+p.rot; }
function thumbFor(p){
  const k = thumbKey(p);
  if(THUMB.has(k)) return THUMB.get(k);
  const pr = (async()=>{
    const d = docById(p.doc);
    const page = await d.js.getPage(p.idx+1);
    const base = page.getViewport({scale:1});
    const sc = Math.min(230/base.width, 320/base.height, 2);
    const vp = page.getViewport({scale:sc, rotation:(page.rotate + p.rot)%360});
    const c = document.createElement("canvas");
    c.width = Math.max(1,Math.ceil(vp.width)); c.height = Math.max(1,Math.ceil(vp.height));
    const cx = c.getContext("2d");
    cx.fillStyle="#fff"; cx.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:cx, viewport:vp}).promise;
    return { url:c.toDataURL("image/jpeg",0.74), w:c.width, h:c.height };
  })().catch(()=>null);
  THUMB.set(k,pr);
  if(THUMB.size>900){ const first=THUMB.keys().next().value; THUMB.delete(first); }
  return pr;
}

let OBS = null;
function observer(){
  if(OBS) return OBS;
  OBS = new IntersectionObserver(entries=>{
    for(const en of entries){
      if(!en.isIntersecting) continue;
      const box = en.target;
      OBS.unobserve(box);
      const uid = box.dataset.uid;
      const p = PAGES[idxOf(uid)];
      if(!p) continue;
      thumbFor(p).then(r=>{
        if(!r) { box.innerHTML='<div class="pgerr">!</div>'; return; }
        if(box.dataset.uid!==uid) return;
        const im = new Image();
        im.src = r.url; im.alt="";
        box.innerHTML=""; box.appendChild(im);
      });
    }
  }, { root:null, rootMargin:"600px 0px" });
  return OBS;
}

                     '<span class="pgnum">'+(i+1)+'</span>';
    const acts = el("div","pgacts");
    const mk=(ic,ti,fn)=>{ const b=el("button","minibtn",ic); b.title=ti; b.onclick=e=>{e.stopPropagation(); fn();}; return b; };
    acts.appendChild(mk(IC.pen, t("peEdit"), ()=>{ openPE(i); }));
    acts.appendChild(mk(IC.rotR, t("aRotR"), ()=>{ p.rot=(p.rot+90)%360; pushHist(); render(); }));
    acts.appendChild(mk(IC.dup,  t("aDup"),  ()=>{ dupAt(i); }));
    acts.appendChild(mk(IC.del,  t("aDel"),  ()=>{ delAt([i]); }));

  }
  g.innerHTML=""; g.appendChild(frag);

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function syncBar(){

/* ---------------- 10. seleção ---------------- */
function setSel(arr){ SEL = new Set(arr); render(); }
$("grid").addEventListener("click", e=>{
  const card = e.target.closest(".pg"); if(!card) return;
  const uid = card.dataset.uid, i = idxOf(uid);
  const tick = e.target.closest(".pgtick");
  if(e.shiftKey && LAST_CLICK>=0){
    const a = Math.min(LAST_CLICK,i), b = Math.max(LAST_CLICK,i);
    for(let k=a;k<=b;k++) SEL.add(PAGES[k].uid);
  } else if(e.ctrlKey || e.metaKey || tick){
    if(SEL.has(uid)) SEL.delete(uid); else SEL.add(uid);
    LAST_CLICK = i;
  } else {
    if(SEL.size===1 && SEL.has(uid)) SEL.delete(uid);
    else { SEL = new Set([uid]); }
    LAST_CLICK = i;
  }
  render();
});

/* ---------------- 11. ações sobre páginas ---------------- */
function rot(deg){
  const s = selIdx(); if(!s.length){ toast(t("errSel"),"warn"); return; }
  for(const i of s) PAGES[i].rot = (((PAGES[i].rot+deg)%360)+360)%360;
  pushHist(); render();
}
function delAt(list){
  if(!list.length) return;
  const kill = new Set(list.map(i=>PAGES[i].uid));
  PAGES = PAGES.filter(p=>!kill.has(p.uid));
  kill.forEach(u=>SEL.delete(u));
  DOCS = DOCS.filter(d=>PAGES.some(p=>p.doc===d.id));
  pushHist(); render();
}
function dupAt(i){
  const p = PAGES[i];
  const nu = "u"+(++UID);
  PAGES.splice(i+1,0,{uid:nu, doc:p.doc, idx:p.idx, rot:p.rot});
  if((EDITS[p.uid]||[]).length) EDITS[nu] = EDITS[p.uid].map(o=>Object.assign({},o));
  pushHist(); render();
}
function dupSel(){
  const s = selIdx(); if(!s.length){ toast(t("errSel"),"warn"); return; }
  const add = s.map(i=>PAGES[i]);
  let off = 0;
  for(let k=s.length-1;k>=0;k--){
    const p = PAGES[s[k]];
    const nu = "u"+(++UID);
    PAGES.splice(s[k]+1,0,{uid:nu, doc:p.doc, idx:p.idx, rot:p.rot});
    if((EDITS[p.uid]||[]).length) EDITS[nu] = EDITS[p.uid].map(o=>Object.assign({},o));
  }
  pushHist(); render();
}
function moveSel(toStart){
  const s = selIdx(); if(!s.length){ toast(t("errSel"),"warn"); return; }
  const move = s.map(i=>PAGES[i]);
  const rest = PAGES.filter(p=>!SEL.has(p.uid));
  PAGES = toStart ? move.concat(rest) : rest.concat(move);
  pushHist(); render();
}
function removeDoc(id){
  PAGES = PAGES.filter(p=>p.doc!==id);
  DOCS = DOCS.filter(d=>d.id!==id);
  SEL = new Set(PAGES.filter(p=>SEL.has(p.uid)).map(p=>p.uid));
  pushHist(); render();
}

/* arrastar para reordenar */
let DRAG = null;
$("grid").addEventListener("dragstart", e=>{
  const card = e.target.closest(".pg"); if(!card) return;
  DRAG = card.dataset.uid; card.classList.add("drag");
  e.dataTransfer.effectAllowed="move";
  try{ e.dataTransfer.setData("text/plain",DRAG); }catch(_){}
});
$("grid").addEventListener("dragend", ()=>{
  DRAG=null;
  $("grid").querySelectorAll(".pg").forEach(c=>c.classList.remove("drag","dropbefore","dropafter"));
});
$("grid").addEventListener("dragover", e=>{
  if(!DRAG) return; e.preventDefault();
  const card = e.target.closest(".pg"); if(!card) return;
  const r = card.getBoundingClientRect();
  const after = (e.clientX - r.left) > r.width/2;
  $("grid").querySelectorAll(".pg").forEach(c=>c.classList.remove("dropbefore","dropafter"));
  card.classList.add(after?"dropafter":"dropbefore");
});
$("grid").addEventListener("drop", e=>{
  if(!DRAG) return; e.preventDefault();
  const card = e.target.closest(".pg"); if(!card) return;
  const r = card.getBoundingClientRect();
  const after = (e.clientX - r.left) > r.width/2;
  const target = card.dataset.uid;
  if(target===DRAG && SEL.size<=1){ DRAG=null; return; }
  /* move o grupo selecionado se a página arrastada faz parte dele */
  const group = SEL.has(DRAG) ? PAGES.filter(p=>SEL.has(p.uid)) : [PAGES[idxOf(DRAG)]];
  const gids = new Set(group.map(p=>p.uid));
  if(gids.has(target)){ DRAG=null; render(); return; }
  const rest = PAGES.filter(p=>!gids.has(p.uid));
  let at = rest.findIndex(p=>p.uid===target);
  if(at<0) at = rest.length-1;
  rest.splice(at+(after?1:0), 0, ...group);
  PAGES = rest; DRAG=null;
  pushHist(); render();
});

/* ---------------- 12. gravar / extrair / dividir ---------------- */
async function libFor(id, cache){
  if(cache[id]) return cache[id];
  const d = docById(id);
  cache[id] = await PDFDoc.load(d.bytes, {ignoreEncryption:false});
  return cache[id];
}
async function buildPdf(list, msg){
  const out = await PDFDoc.create();
  const cache = {};
  const fcache = {};
  if(list.some(p=>(EDITS[p.uid]||[]).length)) await metrics();
  for(let i=0;i<list.length;i++){
    const p = list[i];
    if(i%6===0){ progSet(i,list.length,msg); await paint(); }
    const src = await libFor(p.doc, cache);
    const [cp] = await out.copyPages(src,[p.idx]);
    if(p.rot%360){
      let cur = 0;
      try{ cur = cp.getRotation().angle||0; }catch(_){}
      cp.setRotation(degrees((((cur+p.rot)%360)+360)%360));
    }
    out.addPage(cp);
    await drawEdits(out, cp, p, fcache);
  }
  out.setProducer("DigiPDF · Digit I&D");
  out.setCreator("DigiPDF · Digit I&D");
  return await out.save({useObjectStreams:true});
}
async function savePdf(){
  if(!PAGES.length){ toast(t("errEmpty"),"warn"); return; }
  progOn(t("wSave"));
  try{
    const bytes = await buildPdf(PAGES, t("wSave"));
    const name = (DOCS.length===1 ? baseName(DOCS[0].name) : "digipdf") + "-editado.pdf";
    dl(new Blob([bytes],{type:"application/pdf"}), name);
    toast(t("okSaved",{f:name}),"ok");
  }catch(e){ toast(t("errBad",{f:"PDF"}),"err"); console.error(e); }
  progOff();
}
async function extractSel(){
  const s = selIdx(); if(!s.length){ toast(t("errSel"),"warn"); return; }
  progOn(t("wSave"));
  try{
    const bytes = await buildPdf(s.map(i=>PAGES[i]), t("wSave"));
    const name = (DOCS.length===1?baseName(DOCS[0].name):"digipdf")+"-selecao.pdf";
    dl(new Blob([bytes],{type:"application/pdf"}), name);
    toast(t("okSaved",{f:name}),"ok");
  }catch(e){ toast(t("errBad",{f:"PDF"}),"err"); console.error(e); }
  progOff();
}
function parseRanges(txt, max){
  const out = [];
  const parts = String(txt||"").split(/[,;\n]+/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length) return null;
  for(const p of parts){
    let m = p.match(/^(\d+)\s*[-–a]\s*(\d+)$/);
    if(m){
      let a=+m[1], b=+m[2]; if(a>b){const z=a;a=b;b=z;}
      if(a<1||b>max) return null;
      const r=[]; for(let k=a;k<=b;k++) r.push(k-1);
      out.push(r); continue;
    }
    m = p.match(/^(\d+)$/);
    if(m){ const a=+m[1]; if(a<1||a>max) return null; out.push([a-1]); continue; }
    return null;
  }
  return out;
}
async function doSplit(){
  const mode = document.querySelector('input[name="spm"]:checked').value;
  const n = PAGES.length;
  let groups = [];
  if(mode==="rng"){
    const r = parseRanges($("spRng").value, n);
    if(!r){ toast(t("errRange"),"err"); return; }
    groups = r.map(g=>g.map(i=>PAGES[i]));
  } else if(mode==="evn"){
    const k = Math.max(1, parseInt($("spEvn").value,10)||1);
    for(let i=0;i<n;i+=k) groups.push(PAGES.slice(i,i+k));
  } else {
    for(let i=0;i<n;i++) groups.push([PAGES[i]]);
  }
  closeAll();
  progOn(t("wSplit"));
  const base = DOCS.length===1?baseName(DOCS[0].name):"digipdf";
  try{
    const files = [];
    for(let i=0;i<groups.length;i++){
      progSet(i,groups.length,t("wSplit"));
      await paint();
      const bytes = await buildPdf(groups[i], t("wSplit"));
      files.push({name: base+"-"+String(i+1).padStart(String(groups.length).length,"0")+".pdf", bytes});
    }
    if(files.length===1){
      dl(new Blob([files[0].bytes],{type:"application/pdf"}), files[0].name);
    } else {
      progSet(1,1,"ZIP");
      const zip = new JSZip();
      for(const f of files) zip.file(f.name, f.bytes);
      const blob = await zip.generateAsync({type:"blob",compression:"DEFLATE",compressionOptions:{level:3}});
      dl(blob, base+"-dividido.zip");
    }
    toast(t("okSplit",{n:files.length}),"ok");
  }catch(e){ toast(t("errBad",{f:"PDF"}),"err"); console.error(e); }
  progOff();
}

/* ---------------- 13. modais ---------------- */
function openOv(id){ $(id).classList.remove("hidden"); }
function closeAll(){ document.querySelectorAll(".ov").forEach(o=>o.classList.add("hidden")); }
document.addEventListener("click", e=>{
  if(e.target.hasAttribute && e.target.hasAttribute("data-close")) closeAll();
  const x = e.target.closest && e.target.closest("[data-close]");
  if(x) closeAll();
});
document.querySelectorAll(".ov").forEach(o=>o.addEventListener("click", e=>{ if(e.target===o) closeAll(); }));

function openSplit(){
  $("spInfo").innerHTML = t("spInfo",{n:PAGES.length});
  openOv("ovSplit");
}
document.querySelectorAll('input[name="spm"]').forEach(r=>r.addEventListener("change",()=>{
  const v = document.querySelector('input[name="spm"]:checked').value;
  $("spRngW").classList.toggle("hidden", v!=="rng");
  $("spEvnW").classList.toggle("hidden", v!=="evn");
}));

function openMore(){
  const b = $("moreBody"); b.innerHTML="";
  if(!TOOLS.length){ b.innerHTML='<div class="note i">—</div>'; }
  for(const tool of TOOLS){
    const row = el("button","toolrow");
    row.innerHTML = '<span class="ti">'+tool.icon+'</span><span class="tt"><b>'+esc(t(tool.title))+'</b><span>'+esc(t(tool.sub))+'</span></span>';
    row.onclick = ()=>{ closeAll(); tool.run(); };
    b.appendChild(row);
  }
  openOv("ovMore");
}

/* modal genérico: campos + ação */
function genModal(title, bodyHtml, goLabel, onGo){
  $("genT").textContent = title;
  $("genBody").innerHTML = bodyHtml;
  const g = $("genGo"); g.textContent = goLabel;
  g.onclick = ()=>{ onGo(); };
  openOv("ovGen");
}

/* ---------------- 14. teclado ---------------- */
document.addEventListener("keydown", e=>{
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select") { if(e.key==="Escape") closeAll(); return; }
  if(PE && !$("pedit").classList.contains("hidden")){
    if(e.key==="Escape"){ if(PE.ed) cancelEdit(); else closePE(); return; }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
    if((e.key==="Delete"||e.key==="Backspace") && !PE.ed && PE.sel && PE.sel.kind==="obj"){ e.preventDefault(); peDel(); return; }
    return;
  }
  if(e.key==="Escape"){ closeAll(); return; }
  const cmd = e.ctrlKey||e.metaKey;
  if(cmd && e.key.toLowerCase()==="z"){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(cmd && e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); return; }
  if(cmd && e.key.toLowerCase()==="a"){ if(PAGES.length){ e.preventDefault(); setSel(PAGES.map(p=>p.uid)); } return; }
  if(cmd && e.key.toLowerCase()==="s"){ if(PAGES.length){ e.preventDefault(); savePdf(); } return; }
  if((e.key==="Delete"||e.key==="Backspace") && SEL.size){ e.preventDefault(); delAt(selIdx()); return; }
  if(e.key==="["){ rot(-90); return; }
  if(e.key==="]"){ rot(90); return; }
});

/* ---------------- 15. ligações ---------------- */
function bind(){
  const pick = acc=>{ const f=$("file"); f.accept=acc||".pdf,.xlsx,.xlsm,.xls,.csv,.docx"; f.value=""; f.click(); };
  $("drop").onclick = ()=>pick();
  $("qPdf").onclick = ()=>pick(".pdf");
  $("qXls").onclick = ()=>pick(".xlsx,.xlsm,.xls,.csv");
  $("qDoc").onclick = ()=>pick(".docx");
  $("file").onchange = e=>{ addFiles(e.target.files); e.target.value=""; };

  const dz = $("drop");
  ["dragenter","dragover"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove("over");}));
  dz.addEventListener("drop", e=>{ if(e.dataTransfer&&e.dataTransfer.files) addFiles(e.dataTransfer.files); });
  window.addEventListener("dragover", e=>{ if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes("Files")) e.preventDefault(); });
  window.addEventListener("drop", e=>{
    if(DRAG) return;
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){ e.preventDefault(); addFiles(e.dataTransfer.files); }
  });

  $("bUndo").onclick = undo;
  $("bRedo").onclick = redo;
  $("bAll").onclick  = ()=>setSel(PAGES.map(p=>p.uid));
  $("bNone").onclick = ()=>setSel([]);
  $("bRotL").onclick = ()=>rot(-90);
  $("bRotR").onclick = ()=>rot(90);
  $("bRot180").onclick = ()=>rot(180);
  $("bFirst").onclick = ()=>moveSel(true);
  $("bLast").onclick  = ()=>moveSel(false);
  $("bDup").onclick   = dupSel;
  $("bDel").onclick   = ()=>delAt(selIdx());
  $("bExtract").onclick = extractSel;
  $("bSplit").onclick = openSplit;
  $("bSave").onclick  = savePdf;
  $("bMore").onclick  = openMore;
  $("spGo").onclick   = doSplit;

  $("mAdd").onclick  = ()=>pick();
  $("mRot").onclick  = ()=>rot(90);
  $("mDel").onclick  = ()=>{ if(SEL.size) delAt(selIdx()); else toast(t("errSel"),"warn"); };
  $("mMore").onclick = openMore;
  $("mSave").onclick = savePdf;

  $("bHelp").onclick = openHelp;
  $("bTheme").onclick = toggleTheme;
  $("langs").addEventListener("click", e=>{
    const b = e.target.closest(".seg"); if(!b) return;
    setLang(b.dataset.l);
  });
}

/* ---------------- 16. tema ---------------- */
const TKEY="digipdf_tema";
function curTheme(){ try{ return localStorage.getItem(TKEY)||"claro"; }catch(e){ return "claro"; } }
function applyTheme(v){
  document.documentElement.dataset.theme = (v==="escuro"?"escuro":"");
  $("bTheme").innerHTML = v==="escuro" ? IC.sun : IC.moon;
  const mc = document.querySelector('meta[name="theme-color"]');
  if(mc) mc.setAttribute("content", v==="escuro"?"#0E1420":"#1F6FEB");
}
function toggleTheme(){
  const v = curTheme()==="escuro" ? "claro" : "escuro";
  try{ localStorage.setItem(TKEY,v); }catch(e){}
  applyTheme(v);
}

/* ---------------- 17. idioma ---------------- */
const LKEY="digipdf_lang";
function setLang(l){
  LANG = (I18N[l]?l:"pt");
  try{ localStorage.setItem(LKEY,LANG); }catch(e){}
  document.documentElement.lang = LANG;
  document.querySelectorAll("#langs .seg").forEach(b=>b.classList.toggle("on", b.dataset.l===LANG));
  applyLang();
}
function applyLang(){
  document.querySelectorAll("[data-i18n]").forEach(e=>{ e.innerHTML = t(e.dataset.i18n); });
  $("priv").innerHTML = IC.shield + "<span>" + t("priv") + "</span>";
  $("emptyNote").innerHTML = t("emptyNote");
  $("dropIco").innerHTML = IC.upload;
  $("bUndo").title = tp("undoT"); $("bRedo").title = tp("redoT");
  $("bTheme").title = tp("themeT");
  render();
}

/* ---------------- 18. ajuda ---------------- */
function openHelp(){
  $("helpBody").innerHTML = HELP[LANG]||HELP.pt;
  openOv("ovHelp");
}

/* ---------------- 19. decorar botões com ícones ---------------- */
function deco(id, ic, before){
  const b = $(id); if(!b) return;
  if(b.hasAttribute("data-i18n")){
    const k = b.getAttribute("data-i18n");
    b.removeAttribute("data-i18n");
    const sp = el("span",null,t(k)); sp.setAttribute("data-i18n",k);
    b.innerHTML=""; b.appendChild(sp);
  }
  const s = el("span","bi",ic);
  if(before===false) b.appendChild(s); else b.insertBefore(s, b.firstChild);
}
function icons(){
  deco("bUndo",IC.undo); deco("bRedo",IC.redo);
  deco("bAll",IC.grid); deco("bNone",IC.x);
  deco("bRotL",IC.rotL); deco("bRotR",IC.rotR); deco("bRot180",IC.rot180);
  deco("bFirst",IC.first); deco("bLast",IC.last);
  deco("bDup",IC.dup); deco("bDel",IC.del);
  deco("bMore",IC.more); deco("bExtract",IC.extract);
  deco("bSplit",IC.scissors); deco("bSave",IC.save);
  deco("mAdd",IC.upload_sm||IC.extract); deco("mRot",IC.rotR); deco("mDel",IC.del);
  deco("mMore",IC.more); deco("mSave",IC.save);
  deco("bHelp",IC.info);
  $("dropIco").innerHTML = IC.upload;
  document.querySelectorAll(".x").forEach(b=>{ if(!b.innerHTML.trim()) b.innerHTML=IC.x; });
}

const HELP={
pt:`
<div class="note o"><b>Privacidade.</b> Todo o processamento acontece dentro deste separador do navegador. Nenhum ficheiro, byte ou metadado é enviado para lado nenhum: não existem servidores, nem APIs externas, nem análise de utilização, nem cópias. Depois de a página carregar, o DigiPDF funciona mesmo sem ligação à internet. Quando fechas o separador, tudo desaparece da memória.</div>
<div class="hh">1. Abrir documentos</div>
<p class="hp">Arrasta um ou vários PDF para a zona indicada, ou clica para os escolher no teu computador. Podes abrir vários documentos ao mesmo tempo: as páginas de todos aparecem numa única grelha, cada uma com um ponto colorido que indica de que ficheiro veio. É assim que se juntam documentos — basta abri-los e gravar.</p>
<div class="hh">2. Selecionar páginas</div>
<p class="hp">Clica numa página para a selecionar. Com <kbd>Shift</kbd> selecionas um intervalo desde a última página em que clicaste, e com <kbd>Ctrl</kbd> (ou <kbd>Cmd</kbd>) juntas ou retiras páginas uma a uma. O quadradinho no canto de cada página faz o mesmo. <kbd>Ctrl</kbd>+<kbd>A</kbd> seleciona tudo.</p>
<div class="hh">3. Rodar, apagar, duplicar e reordenar</div>
<p class="hp">Com páginas selecionadas usa os botões da barra para rodar −90°, +90° ou 180°, duplicar, eliminar, ou mandar para o início ou para o fim do documento. Para mudar a ordem, arrasta uma página para o lugar onde a queres; se tiveres várias selecionadas, todas se movem juntas. Cada página tem também botões rápidos de rodar, duplicar e eliminar.</p>
<div class="hh">4. Desfazer sem limite</div>
<p class="hp">Todas as alterações podem ser desfeitas com <kbd>Ctrl</kbd>+<kbd>Z</kbd> e refeitas com <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd>. Não há limite de passos: podes voltar atrás até ao momento em que abriste os ficheiros.</p>
<div class="hh">5. Guardar, extrair e dividir</div>
<p class="hp"><b>Guardar PDF</b> cria um ficheiro novo com as páginas na ordem e na rotação que vês no ecrã. <b>Extrair seleção</b> cria um PDF apenas com as páginas selecionadas. <b>Dividir</b> permite três formas: por intervalos que indicas (por exemplo <b>1-3, 7, 9-12</b>), a cada N páginas, ou uma página por ficheiro. Quando resulta mais do que um ficheiro, o DigiPDF entrega-os dentro de um ZIP.</p>
<div class="hh">6. Atalhos de teclado</div>
<p class="hp"><kbd>Ctrl</kbd>+<kbd>A</kbd> selecionar tudo · <kbd>Delete</kbd> eliminar a seleção · <kbd>[</kbd> e <kbd>]</kbd> rodar · <kbd>Ctrl</kbd>+<kbd>S</kbd> guardar · <kbd>Ctrl</kbd>+<kbd>Z</kbd> desfazer · <kbd>Esc</kbd> fechar janelas.</p>
<div class="hh">7. Editar uma página</div>
<p class="hp">Duplo clique numa miniatura — ou o botão do lápis no pé dela — abre a página sozinha, em grande. Os parágrafos que têm texto por baixo ficam marcados; ao clicar num deles escreve-se dentro dele, com o tamanho, a cor e o alinhamento do original. Também se pode escrever texto novo, tapar uma zona, inserir uma imagem ou assinatura, e desenhar linhas e retângulos. <b>Aplicar à página</b> volta à grelha com as alterações postas, e depois <b>Guardar PDF</b> escreve tudo no ficheiro; nada é definitivo antes disso e <b>Repor o texto original</b> devolve o texto exacto.</p>
<p class="hp">Duas coisas ditas à cara: trocar texto existente é tapar o antigo e voltar a desenhá-lo, por isso só se oferece quando o fundo é liso — sobre uma imagem ficaria uma mancha, e nesse caso o editor recusa e explica. E a letra original quase nunca pode ser reutilizada, porque os PDF trazem as fontes em subconjunto, só com os caracteres que já estavam na página: o DigiPDF mede a letra do original, escolhe a mais parecida das que consegue desenhar sem ligação à internet, e diz-te qual usou.</p>
<div class="hh">8. O que o DigiPDF não faz</div>
<p class="hp">Não abre PDF protegidos por palavra-passe e não coloca nem retira palavras-passe: fazê-lo bem exige criptografia que não é segura de implementar deste lado. Não faz reconhecimento de texto (OCR): se um PDF for uma digitalização, as páginas são imagens e não há texto para converter — o DigiPDF avisa-te em vez de devolver um resultado vazio. Ficheiros muito grandes (acima de 50 MB) podem esgotar a memória do navegador.</p>
`,
en:`
<div class="note o"><b>Privacy.</b> All processing happens inside this browser tab. No file, byte or piece of metadata is sent anywhere: there are no servers, no external APIs, no usage analytics and no copies. Once the page has loaded, DigiPDF works even with no internet connection. When you close the tab, everything is gone from memory.</div>
<div class="hh">1. Opening documents</div>
<p class="hp">Drag one or more PDFs onto the drop area, or click to pick them from your computer. You can open several documents at once: pages from all of them appear in a single grid, each with a coloured dot showing which file it came from. That is how merging works here — just open the files and save.</p>
<div class="hh">2. Selecting pages</div>
<p class="hp">Click a page to select it. <kbd>Shift</kbd> selects a range from the last page you clicked, and <kbd>Ctrl</kbd> (or <kbd>Cmd</kbd>) adds or removes pages one by one. The little square in the corner of each page does the same. <kbd>Ctrl</kbd>+<kbd>A</kbd> selects everything.</p>
<div class="hh">3. Rotate, delete, duplicate and reorder</div>
<p class="hp">With pages selected, use the toolbar to rotate −90°, +90° or 180°, duplicate, delete, or send them to the start or the end of the document. To change the order, drag a page where you want it; if several are selected they all move together. Each page also has quick rotate, duplicate and delete buttons.</p>
<div class="hh">4. Unlimited undo</div>
<p class="hp">Every change can be undone with <kbd>Ctrl</kbd>+<kbd>Z</kbd> and redone with <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd>. There is no step limit: you can go all the way back to the moment you opened the files.</p>
<div class="hh">5. Save, extract and split</div>
<p class="hp"><b>Save PDF</b> creates a new file with the pages in the order and rotation you see on screen. <b>Extract selection</b> creates a PDF with the selected pages only. <b>Split</b> offers three ways: by ranges you type (for example <b>1-3, 7, 9-12</b>), every N pages, or one page per file. When the result is more than one file, DigiPDF hands them over inside a ZIP.</p>
<div class="hh">6. Keyboard shortcuts</div>
<p class="hp"><kbd>Ctrl</kbd>+<kbd>A</kbd> select all · <kbd>Delete</kbd> delete selection · <kbd>[</kbd> and <kbd>]</kbd> rotate · <kbd>Ctrl</kbd>+<kbd>S</kbd> save · <kbd>Ctrl</kbd>+<kbd>Z</kbd> undo · <kbd>Esc</kbd> close dialogs.</p>
<div class="hh">7. Editing a page</div>
<p class="hp">Double-click a thumbnail — or the pencil button in its footer — to open that page on its own, in a large view. Paragraphs with text underneath are outlined; click one to write inside it, keeping the original size, colour and alignment. You can also write new text, cover an area, insert an image or signature, and draw lines and rectangles. <b>Apply to page</b> returns to the grid with the changes in place, and <b>Save PDF</b> then writes everything into the file; nothing is final before that, and <b>Restore the original text</b> gives the exact text back.</p>
<p class="hp">Two things said plainly: replacing existing text means covering the old text and drawing it again, so it is only offered when the background is flat — over an image it would leave a visible patch, and there the editor refuses and explains why. And the original font can almost never be reused, because PDFs carry fonts as subsets holding only the characters already on the page: DigiPDF measures the original, picks the closest font it can draw with no internet connection, and tells you which one it used.</p>
<div class="hh">8. What DigiPDF does not do</div>
<p class="hp">It does not open password-protected PDFs and it neither adds nor removes passwords: doing that properly requires cryptography that cannot be implemented safely on this side. It does no text recognition (OCR): if a PDF is a scan, the pages are images and there is no text to convert — DigiPDF tells you instead of handing back an empty result. Very large files (over 50 MB) may exhaust the browser's memory.</p>
`,
es:`
<div class="note o"><b>Privacidad.</b> Todo el procesamiento ocurre dentro de esta pestaña del navegador. Ningún fichero, byte o metadato se envía a ningún sitio: no hay servidores, ni APIs externas, ni analítica de uso, ni copias. Una vez cargada la página, DigiPDF funciona incluso sin conexión a internet. Al cerrar la pestaña, todo desaparece de la memoria.</div>
<div class="hh">1. Abrir documentos</div>
<p class="hp">Arrastra uno o varios PDF a la zona indicada, o haz clic para elegirlos de tu ordenador. Puedes abrir varios documentos a la vez: las páginas de todos aparecen en una sola cuadrícula, cada una con un punto de color que indica de qué fichero viene. Así se unen documentos aquí: basta abrirlos y guardar.</p>
<div class="hh">2. Seleccionar páginas</div>
<p class="hp">Haz clic en una página para seleccionarla. Con <kbd>Shift</kbd> seleccionas un intervalo desde la última página en la que hiciste clic, y con <kbd>Ctrl</kbd> (o <kbd>Cmd</kbd>) añades o quitas páginas una a una. El cuadradito de la esquina de cada página hace lo mismo. <kbd>Ctrl</kbd>+<kbd>A</kbd> selecciona todo.</p>
<div class="hh">3. Girar, borrar, duplicar y reordenar</div>
<p class="hp">Con páginas seleccionadas usa los botones de la barra para girar −90°, +90° o 180°, duplicar, eliminar, o enviarlas al principio o al final del documento. Para cambiar el orden, arrastra una página al lugar que quieras; si tienes varias seleccionadas, todas se mueven juntas. Cada página tiene además botones rápidos de girar, duplicar y eliminar.</p>
<div class="hh">4. Deshacer sin límite</div>
<p class="hp">Cualquier cambio se puede deshacer con <kbd>Ctrl</kbd>+<kbd>Z</kbd> y rehacer con <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd>. No hay límite de pasos: puedes volver hasta el momento en que abriste los ficheros.</p>
<div class="hh">5. Guardar, extraer y dividir</div>
<p class="hp"><b>Guardar PDF</b> crea un fichero nuevo con las páginas en el orden y la rotación que ves en pantalla. <b>Extraer selección</b> crea un PDF solo con las páginas seleccionadas. <b>Dividir</b> ofrece tres formas: por intervalos que indicas (por ejemplo <b>1-3, 7, 9-12</b>), cada N páginas, o una página por fichero. Cuando el resultado es más de un fichero, DigiPDF los entrega dentro de un ZIP.</p>
<div class="hh">6. Atajos de teclado</div>
<p class="hp"><kbd>Ctrl</kbd>+<kbd>A</kbd> seleccionar todo · <kbd>Delete</kbd> eliminar la selección · <kbd>[</kbd> y <kbd>]</kbd> girar · <kbd>Ctrl</kbd>+<kbd>S</kbd> guardar · <kbd>Ctrl</kbd>+<kbd>Z</kbd> deshacer · <kbd>Esc</kbd> cerrar ventanas.</p>
<div class="hh">7. Editar una página</div>
<p class="hp">Doble clic en una miniatura — o el botón del lápiz de su pie — abre esa página sola, en grande. Los párrafos que tienen texto debajo quedan marcados; al hacer clic en uno se escribe dentro, con el tamaño, el color y la alineación del original. También se puede escribir texto nuevo, tapar una zona, insertar una imagen o firma, y dibujar líneas y rectángulos. <b>Aplicar a la página</b> vuelve a la cuadrícula con los cambios puestos, y luego <b>Guardar PDF</b> lo escribe todo en el fichero; nada es definitivo antes de eso, y <b>Restaurar el texto original</b> devuelve el texto exacto.</p>
<p class="hp">Dos cosas dichas a la cara: cambiar texto existente es tapar el viejo y volver a dibujarlo, así que solo se ofrece cuando el fondo es liso — sobre una imagen quedaría una mancha, y ahí el editor se niega y lo explica. Y la letra original casi nunca se puede reutilizar, porque los PDF llevan las fuentes en subconjunto, solo con los caracteres que ya estaban en la página: DigiPDF mide la del original, elige la más parecida de las que puede dibujar sin conexión, y te dice cuál usó.</p>
<div class="hh">8. Lo que DigiPDF no hace</div>
<p class="hp">No abre PDF protegidos con contraseña y no pone ni quita contraseñas: hacerlo bien exige criptografía que no es seguro implementar de este lado. No hace reconocimiento de texto (OCR): si un PDF es un escaneo, las páginas son imágenes y no hay texto que convertir — DigiPDF te avisa en lugar de devolver un resultado vacío. Los ficheros muy grandes (más de 50 MB) pueden agotar la memoria del navegador.</p>
`};

/* ---------------- 23. modal grande construído em JS ---------------- */
function bigModal(title, wide){
  const ov = el("div","ov");
  const mo = el("div","mo"+(wide?" wide":""));
  const h  = el("div","mo-h"); const h3=el("h3",null,esc(title));
  const x  = el("button","x",IC.x);
  h.appendChild(h3); h.appendChild(x);
  const b  = el("div","mo-b");
  const f  = el("div","mo-f"); f.appendChild(el("div","sp"));
  mo.appendChild(h); mo.appendChild(b); mo.appendChild(f);
  ov.appendChild(mo); document.body.appendChild(ov);
  const api = {
    body:b, foot:f, ov:ov,
    close(){ ov.remove(); },
    btn(label,cls,fn){ const bt=el("button","btn "+(cls||"g"),esc(label)); bt.onclick=fn; f.appendChild(bt); return bt; }
  };
  x.onclick = api.close;
  ov.addEventListener("click", e=>{ if(e.target===ov) api.close(); });
  return api;
}

/* ---------------- 24. texto seguro para as fontes padrão ---------------- */
const WAMAP = {"‘":"'","’":"'","‚":"'","‛":"'","“":'"',"”":'"',
 "„":'"',"′":"'","″":'"',"–":"-","—":"-","−":"-","…":"...",
 " ":" "," ":" "," ":" "," ":" ","​":"","•":"-","●":"-",
 "→":"->","←":"<-","≤":"<=","≥":">=","·":"·","\t":"    "};
function wa(s){
  s = String(s==null?"":s);
  let o="";
  for(const ch of s){
    if(WAMAP[ch]!=null){ o+=WAMAP[ch]; continue; }
    const c = ch.codePointAt(0);
    if(c===10||c===13){ o+=" "; continue; }
    if(c<32){ continue; }
    if(c<=255){ o+=ch; continue; }
    if(c===0x20AC){ o+=ch; continue; }         /* € existe em WinAnsi */
    o+="?";
  }
  return o;
}

/* ---------------- 25. extração de texto com posições ---------------- */
async function extractPageRows(d, pageIdx){
  const page = await d.js.getPage(pageIdx+1);
  const tc = await page.getTextContent();
  const items = [];
  for(const it of tc.items){
    if(!it.str || !it.str.trim()) continue;
    const tr = it.transform;
    items.push({ x:tr[4], y:tr[5], w:it.width||0, h:Math.abs(tr[3])||Math.abs(it.height)||10, s:it.str });
  }
  if(!items.length) return { lines:[], rows:[], cols:0, empty:true };

  /* linhas: agrupar por y */
  items.sort((a,b)=> (b.y-a.y) || (a.x-b.x));
  const lines=[]; let cur=null;
  for(const it of items){
    const tol = Math.max(2, it.h*0.55);
    if(cur && Math.abs(cur.y - it.y) <= tol){ cur.items.push(it); cur.y=(cur.y*cur.items.length+it.y)/(cur.items.length+1); }
    else { cur={ y:it.y, items:[it] }; lines.push(cur); }
  }
  for(const L of lines) L.items.sort((a,b)=>a.x-b.x);

  /* colunas: posições de início repetidas em várias linhas */
  const freq = new Map();
  for(const L of lines) for(const it of L.items){
    const k = Math.round(it.x/3)*3;
    freq.set(k,(freq.get(k)||0)+1);
  }
  const need = Math.max(3, Math.round(lines.length*0.30));
  let starts = Array.from(freq.entries()).filter(([k,v])=>v>=need).map(([k])=>k).sort((a,b)=>a-b);
  const merged=[];
  for(const s of starts){ if(!merged.length || s-merged[merged.length-1]>10) merged.push(s); }
  starts = merged;

  const tabular = starts.length>=2;
  const rows=[];
  for(const L of lines){
    if(!tabular){ rows.push([ L.items.map(i=>i.s).join(" ").replace(/\s+/g," ").trim() ]); continue; }
    const cells = new Array(starts.length).fill("");
    for(const it of L.items){
      let c=0;
      for(let k=0;k<starts.length;k++) if(it.x >= starts[k]-6) c=k;
      cells[c] = (cells[c] ? cells[c]+" " : "") + it.s;
    }
    rows.push(cells.map(c=>c.replace(/\s+/g," ").trim()));
  }
  return { lines: lines.map(L=>({ y:L.y, h:L.items[0].h, s:L.items.map(i=>i.s).join(" ").replace(/\s+/g," ").trim() })),
           rows, cols: tabular?starts.length:1, tabular, empty:false };
}

async function extractAll(d, msg){

  }
  progOff();
  return pages;
}

/* datas */
const MON=/^(\d{1,4})[-\/.](\d{1,2})[-\/.](\d{2,4})$/;
function toDate(s){
  const v=String(s).trim(); const m=v.match(MON); if(!m) return null;
  let a=+m[1], b=+m[2], c=+m[3];
  let y,mo,d;
  if(m[1].length===4){ y=a; mo=b; d=c; }
  else { d=a; mo=b; y=c<100 ? (c<70?2000+c:1900+c) : c; }
  if(mo<1||mo>12||d<1||d>31||y<1900||y>2200) return null;
  const dt=new Date(y,mo-1,d);
  if(dt.getMonth()!==mo-1||dt.getDate()!==d) return null;
  return dt;
}

/* números */
function toNum(s){
  const v = String(s).trim();
  if(!v || !/\d/.test(v)) return null;
  if(!/^[-+(]?\s*[\d.,\s]*\d\s*\)?\s*[%€$]?$/.test(v)) return null;
  let neg = /^\(.*\)$/.test(v) || /^-/.test(v);
  let x = v.replace(/[()\s%€$+-]/g,"");
  const lc = x.lastIndexOf(","), ld = x.lastIndexOf(".");
  if(lc>-1 && ld>-1){
    if(lc>ld) x = x.replace(/\./g,"").replace(",",".");
    else x = x.replace(/,/g,"");
  } else if(lc>-1){
    const dec = x.length-lc-1;
    x = (dec===3 && /^\d{1,3}(,\d{3})+$/.test(x)) ? x.replace(/,/g,"") : x.replace(",",".");
  } else if(ld>-1){
    const dec = x.length-ld-1;
    if(dec===3 && /^\d{1,3}(\.\d{3})+$/.test(x)) x = x.replace(/\./g,"");
  }
  if(!/^\d*\.?\d+$/.test(x)) return null;
  const n = parseFloat(x);
  if(!isFinite(n)) return null;
  return neg ? -n : n;
}

const SIZES = { A4:[595.28,841.89], A3:[841.89,1190.55], Letter:[612,792], Legal:[612,1008] };

async function stdFonts(pdf){
  return {
    r: await pdf.embedFont(PDFLib.StandardFonts.Helvetica),
    b: await pdf.embedFont(PDFLib.StandardFonts.HelveticaBold),
    i: await pdf.embedFont(PDFLib.StandardFonts.HelveticaOblique),
    bi:await pdf.embedFont(PDFLib.StandardFonts.HelveticaBoldOblique)
  };
}
function fitText(s, font, size, maxW){
  s = wa(s);
  if(font.widthOfTextAtSize(s,size) <= maxW) return s;
  let lo=0, hi=s.length;
  while(lo<hi){
    const mid=(lo+hi+1)>>1;
    if(font.widthOfTextAtSize(s.slice(0,mid)+"…",size)<=maxW) lo=mid; else hi=mid-1;
  }
  return s.slice(0,lo)+"…";
}
function wrapRuns(runs, fonts, size, maxW){
  /* runs: [{text,bold,italic}] -> linhas de runs */
  const pick = r => r.bold&&r.italic?fonts.bi : r.bold?fonts.b : r.italic?fonts.i : fonts.r;
  const words=[];
  for(const r of runs){
    const parts = wa(r.text).split(/(\s+)/);
    for(const p of parts){ if(p==="") continue; words.push({txt:p, r:r, sp:/^\s+$/.test(p)}); }
  }
  const lines=[]; let line=[], w=0;
  for(const wd of words){
    const ww = pick(wd.r).widthOfTextAtSize(wd.txt,size);
    if(w+ww>maxW && line.length && !wd.sp){ lines.push(line); line=[]; w=0; }
    if(wd.sp && !line.length) continue;
    line.push(wd); w+=ww;
  }
  if(line.length) lines.push(line);
  return lines.length?lines:[[]];
}

async function readSheetFile(file){
  const buf = await file.arrayBuffer();
  let wb;
  if(/\.csv$/i.test(file.name)){
    /* CSV: o texto tem de ser descodificado explicitamente, senão os acentos saem trocados */
    let txt=null;
    try{ txt = new TextDecoder("utf-8",{fatal:true}).decode(buf); }
    catch(e){ txt = new TextDecoder("windows-1252").decode(buf); }
    if(txt.charCodeAt(0)===0xFEFF) txt = txt.slice(1);
    wb = XLSX.read(txt,{type:"string",dense:true,raw:true});
  } else {
    wb = XLSX.read(buf,{type:"array",cellDates:true,dense:true});
  }
  const out=[];
  for(const nm of wb.SheetNames){
    const ws = wb.Sheets[nm];
    const fmt = XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:"",blankrows:false});
    const raw = XLSX.utils.sheet_to_json(ws,{header:1,raw:true, defval:"",blankrows:false});
    out.push({ name:nm, rows:fmt.map(r=>r.map(c=>String(c==null?"":c))), raw:raw });
  }
  return out;
}

async function buildSheetPdf(file, sheets, opt){
  progOn(t("wBuild"));
  try{
    const pdf = await PDFDoc.create();
    const F = await stdFonts(pdf);
    const M = 34;
    for(let si=0; si<sheets.length; si++){
      const sh = sheets[si];
      const nc = sh.rows.reduce((a,r)=>Math.max(a,r.length),0);
      const nums = new Array(nc).fill(0), tot = new Array(nc).fill(0);
      for(let r=1;r<sh.raw.length;r++) for(let c=0;c<nc;c++){
        const v=sh.raw[r]&&sh.raw[r][c];
        if(v==null||v==="") continue; tot[c]++;
        if(typeof v==="number"||v instanceof Date) nums[c]++;
        else if(typeof v==="string" && toNum(v)!==null) nums[c]++;
      }
      const numeric = nums.map((n,c)=> tot[c]>0 && n/tot[c]>0.6 );

      let size = 8;
      let W = SIZES[opt.size][0], H = SIZES[opt.size][1];
      /* largura natural */
      const nat = new Array(nc).fill(24);
      for(let r=0;r<sh.rows.length;r++) for(let c=0;c<nc;c++){
        const s = wa(String(sh.rows[r][c]||""));
        const fnt = r===0?F.b:F.r;
        nat[c] = Math.max(nat[c], Math.min(240, fnt.widthOfTextAtSize(s,size)+10));
      }
      const natTot = nat.reduce((a,b)=>a+b,0);
      let land = opt.ori==="l";
      if(opt.ori==="auto") land = natTot > (H-2*M);
      if(land){ const z=W; W=H; H=z; }
      const avail = W-2*M;
      let cw = nat.slice();
      if(natTot>avail){
        if(opt.fit==="w"){
          const k = avail/natTot;
          size = Math.max(5, Math.min(8, 8*Math.max(k,0.62)));
          cw = nat.map(v=>v*k);
        } else {
          const k = avail/natTot; cw = nat.map(v=>v*k);
        }
      } else {
        const extra=(avail-natTot)/nc; cw = nat.map(v=>v+extra);
      }
      const rh = size*1.75;
      let page=null, y=0;
      const newPage=()=>{
        page = pdf.addPage([W,H]); y = H-M;
        page.drawText(wa(sh.name), {x:M, y:y+3, size:9, font:F.b, color:PDFLib.rgb(.35,.4,.48)});
        y -= 12;
        if(opt.rep && sh.rows.length) drawRow(sh.rows[0], true);
      };
      const drawRow=(row,head)=>{
        let x=M;
        if(head) page.drawRectangle({x:M,y:y-rh+3,width:cw.reduce((a,b)=>a+b,0),height:rh,color:PDFLib.rgb(.93,.95,.98)});
        for(let c=0;c<nc;c++){
          const s = String(row[c]==null?"":row[c]);
          if(s!==""){
            const fnt = head?F.b:F.r;
            const txt = fitText(s,fnt,size,cw[c]-8);
            const tw = fnt.widthOfTextAtSize(txt,size);
            const rightAl = !head && numeric[c];
            page.drawText(txt,{ x: rightAl ? x+cw[c]-4-tw : x+4, y: y-rh+size*0.62, size, font:fnt,
                                color:PDFLib.rgb(.07,.1,.15) });
          }
          if(opt.grid) page.drawLine({start:{x:x,y:y+3},end:{x:x,y:y-rh+3},thickness:.4,color:PDFLib.rgb(.82,.85,.9)});
          x+=cw[c];
        }
        if(opt.grid){
          page.drawLine({start:{x:x,y:y+3},end:{x:x,y:y-rh+3},thickness:.4,color:PDFLib.rgb(.82,.85,.9)});
          page.drawLine({start:{x:M,y:y-rh+3},end:{x:x,y:y-rh+3},thickness:.4,color:PDFLib.rgb(.82,.85,.9)});
        }
        y-=rh;
      };
      newPage();
      if(opt.grid) page.drawLine({start:{x:M,y:y+3},end:{x:M+cw.reduce((a,b)=>a+b,0),y:y+3},thickness:.4,color:PDFLib.rgb(.82,.85,.9)});
      for(let r=(opt.rep?1:0); r<sh.rows.length; r++){
        if(y-rh < M){ newPage(); }
        drawRow(sh.rows[r], !opt.rep && r===0);
        if(r%140===0){ progSet(r, sh.rows.length, t("wBuild")); await paint(); }
      }
    }
    pdf.setProducer("DigiPDF · Digit I&D"); pdf.setCreator("DigiPDF · Digit I&D");
    const bytes = await pdf.save();
    const name = baseName(file.name)+".pdf";
    dl(new Blob([bytes],{type:"application/pdf"}), name);
    toast(t("okConv",{f:name}),"ok");
  }catch(e){ console.error(e); toast(t("errBad",{f:file.name}),"err"); }
  progOff();
}

function htmlToBlocks(html){
  const doc = new DOMParser().parseFromString(html,"text/html");
  const blocks=[];
  const runsOf=(node, st)=>{
    const out=[];
    node.childNodes.forEach(n=>{
      if(n.nodeType===3){ if(n.nodeValue) out.push({text:n.nodeValue, bold:st.b, italic:st.i}); return; }
      if(n.nodeType!==1) return;
      const tag=n.tagName.toLowerCase();
      const s2={ b: st.b || tag==="strong"||tag==="b", i: st.i || tag==="em"||tag==="i" };
      if(tag==="br"){ out.push({text:"\n",bold:st.b,italic:st.i}); return; }
      out.push(...runsOf(n,s2));
    });
    return out;
  };
  const walk=(parent, depth)=>{
    parent.childNodes.forEach(n=>{
      if(n.nodeType!==1) return;
      const tag=n.tagName.toLowerCase();
      if(/^h[1-6]$/.test(tag)){
        blocks.push({type:"h", lvl:+tag[1], runs:runsOf(n,{b:true,i:false})});
      } else if(tag==="p"){
        const rs = runsOf(n,{b:false,i:false});
        blocks.push({type:"p", runs:rs, indent:depth*16});
      } else if(tag==="ul"||tag==="ol"){
        let k=1;
        n.querySelectorAll(":scope > li").forEach(li=>{
          blocks.push({type:"li", bullet: tag==="ol" ? (k++)+"." : "•",
                       runs: runsOf(li,{b:false,i:false}), indent: depth*16+14});
          li.querySelectorAll(":scope > ul, :scope > ol").forEach(sub=>walk(sub.parentNode, depth+1));
        });
      } else if(tag==="table"){
        const rows=[];
        n.querySelectorAll("tr").forEach(tr=>{
          const cells=[]; tr.querySelectorAll("th,td").forEach(td=>cells.push(td.textContent.replace(/\s+/g," ").trim()));
          if(cells.length) rows.push(cells);
        });
        if(rows.length) blocks.push({type:"table", rows});
      } else {
        walk(n, depth);
      }
    });
  };
  walk(doc.body,0);
  return blocks.filter(b=> b.type==="table" || (b.runs && b.runs.some(r=>r.text.trim()!=="")) );
}
async function buildDocxPdf(file, szName, ori){
  progOn(t("wBuild"));
  try{
    const buf = await file.arrayBuffer();
    const res = await mammoth.convertToHtml({arrayBuffer:buf});
    const blocks = htmlToBlocks(res.value||"");
    if(!blocks.length){ toast(t("o2pEmpty"),"warn"); progOff(); return; }
    let [W,H]=SIZES[szName]; if(ori==="l"){ const z=W; W=H; H=z; }
    const pdf = await PDFDoc.create(); const F = await stdFonts(pdf);
    const M=56, avail=W-2*M;
    let page=pdf.addPage([W,H]), y=H-M;
    const nl=(need)=>{ if(y-need<M){ page=pdf.addPage([W,H]); y=H-M; } };
    const HS={1:19,2:16,3:14,4:12.5,5:11.5,6:11};
    for(let bi=0; bi<blocks.length; bi++){
      const b=blocks[bi];
      if(bi%25===0){ progSet(bi,blocks.length,t("wBuild")); await paint(); }
      if(b.type==="table"){
        const nc=b.rows.reduce((a,r)=>Math.max(a,r.length),0);
        const cw=avail/nc, size=8.5, rh=size*1.8;
        for(let ri=0; ri<b.rows.length; ri++){
          nl(rh+4);
          let x=M; const head=ri===0;
          if(head) page.drawRectangle({x:M,y:y-rh,width:avail,height:rh,color:PDFLib.rgb(.93,.95,.98)});
          for(let c=0;c<nc;c++){
            const s=String(b.rows[ri][c]||"");
            if(s) page.drawText(fitText(s, head?F.b:F.r, size, cw-8), {x:x+4, y:y-rh+size*0.6, size, font:head?F.b:F.r, color:PDFLib.rgb(.07,.1,.15)});
            page.drawLine({start:{x:x,y:y},end:{x:x,y:y-rh},thickness:.4,color:PDFLib.rgb(.82,.85,.9)});
            x+=cw;
          }
          page.drawLine({start:{x:x,y:y},end:{x:x,y:y-rh},thickness:.4,color:PDFLib.rgb(.82,.85,.9)});
          page.drawLine({start:{x:M,y:y-rh},end:{x:M+avail,y:y-rh},thickness:.4,color:PDFLib.rgb(.82,.85,.9)});
          if(ri===0) page.drawLine({start:{x:M,y:y},end:{x:M+avail,y:y},thickness:.4,color:PDFLib.rgb(.82,.85,.9)});
          y-=rh;
        }
        y-=8; continue;
      }
      const size = b.type==="h" ? (HS[b.lvl]||12) : 10.5;
      const lead = size*1.42;
      const ind = b.indent||0;
      const lines = wrapRuns(b.runs, F, size, avail-ind);
      if(b.type==="h"){ y-=6; nl(lead+8); }
      for(let li=0; li<lines.length; li++){
        nl(lead);
        let x = M+ind;
        if(b.type==="li" && li===0){
          page.drawText(wa(b.bullet),{x:M+ind-14,y:y-size,size,font:F.r,color:PDFLib.rgb(.3,.35,.42)});
        }
        for(const wd of lines[li]){
          const fnt = wd.r.bold&&wd.r.italic?F.bi : wd.r.bold?F.b : wd.r.italic?F.i : F.r;
          const txt = wa(wd.txt);
          if(txt.trim()!=="") page.drawText(txt,{x,y:y-size,size,font:fnt,color:PDFLib.rgb(.07,.1,.15)});
          x += fnt.widthOfTextAtSize(txt,size);
        }
        y-=lead;
      }
      y -= b.type==="h" ? 5 : (b.type==="li" ? 2 : 6);
    }
    pdf.setProducer("DigiPDF · Digit I&D"); pdf.setCreator("DigiPDF · Digit I&D");
    pdf.setTitle(baseName(file.name));
    const bytes = await pdf.save();
    const name = baseName(file.name)+".pdf";
    dl(new Blob([bytes],{type:"application/pdf"}), name);
    toast(t("okConv",{f:name}),"ok");
  }catch(e){ console.error(e); toast(t("errBad",{f:file.name}),"err"); }
  progOff();
}

async function doCompress(q,dpi){
  progOn(t("cmpGo"));
  try{
    const before = DOCS.reduce((a,d)=>a+d.size,0);
    const pdf = await PDFDoc.create();
    const scale = dpi/72;
    for(let i=0;i<PAGES.length;i++){
      progSet(i,PAGES.length,t("cmpGo")); await paint();
      const p=PAGES[i], d=docById(p.doc);
      const jp = await d.js.getPage(p.idx+1);
      const vp = jp.getViewport({scale, rotation:(jp.rotate+p.rot)%360});
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.ceil(vp.width)); c.height=Math.max(1,Math.ceil(vp.height));
      const cx=c.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,c.width,c.height);
      await jp.render({canvasContext:cx, viewport:vp}).promise;
      const url = c.toDataURL("image/jpeg", q);
      const img = await pdf.embedJpg(url);
      const pw = vp.width/scale, ph = vp.height/scale;
      const pgn = pdf.addPage([pw,ph]);
      pgn.drawImage(img,{x:0,y:0,width:pw,height:ph});
    }
    pdf.setProducer("DigiPDF · Digit I&D"); pdf.setCreator("DigiPDF · Digit I&D");
    const bytes = await pdf.save();
    const after = bytes.length;
    const pct = before>0 ? Math.round((1-after/before)*100) : 0;
    const name = (DOCS.length===1?baseName(DOCS[0].name):"digipdf")+"-comprimido.pdf";
    dl(new Blob([bytes],{type:"application/pdf"}), name);
    toast(t("cmpR",{a:fmtBytes(before), b:fmtBytes(after), p:(pct>0?("−"+pct+"%"):("+"+Math.abs(pct)+"%"))}), pct>0?"ok":"warn", 12000);
    if(after>=before) toast(t("cmpWorse"),"warn",12000);
  }catch(e){ console.error(e); toast(t("errBad",{f:"PDF"}),"err"); }
  progOff();
}

async function applyStamp(kind,o){
  progOn(t("wSave"));
  try{
    const selSet = new Set(selIdx());
    const base = await buildPdf(PAGES, t("wSave"));
    const pdf = await PDFDoc.load(base);
    const F = await stdFonts(pdf);
    const pgs = pdf.getPages();
    const N = pgs.length;
    for(let i=0;i<N;i++){
      if(i%25===0){ progSet(i,N,t("wSave")); await paint(); }
      const pg = pgs[i];
      const { width:W, height:H } = pg.getSize();
      const rot = (pg.getRotation && pg.getRotation().angle) || 0;
      const land = (rot%180)!==0;
      const w = land?H:W, h = land?W:H;
      if(kind==="wmk"){
        if(o.only && !selSet.has(i)) continue;
        if(!o.txt.trim()) continue;
        let txt = wa(o.txt);
        const c = WCOLS[o.col]||WCOLS.grey;
        const a = o.ang*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a);
        /* encolhe se não couber na diagonal */
        let size = o.size;
        const diag = Math.abs(w*ca)+Math.abs(h*sa);
        while(size>6 && F.b.widthOfTextAtSize(txt,size) > diag*0.92) size -= 1;
        const tw = F.b.widthOfTextAtSize(txt,size);
        /* o texto roda em torno do ponto inicial: recuar meio comprimento e meia altura */
        const x = w/2 - (tw/2)*ca + (size*0.35)*sa;
        const y = h/2 - (tw/2)*sa - (size*0.35)*ca;
        pg.drawText(txt,{ x, y, size, font:F.b, color:PDFLib.rgb(c[0],c[1],c[2]), opacity:o.op,
          rotate:degrees(o.ang) });
      } else {
        if(o.skip && i===0) continue;
        const n = o.start + i;
        const tot = o.start + N - 1;
        const txt = wa(o.fmt==="1" ? String(n) : o.fmt==="2" ? (n+" / "+tot) : (tp("numF3").replace("1",String(n)).replace("N",String(tot))));
        const tw = F.r.widthOfTextAtSize(txt,o.size);
        const mx = 34, my = 26;
        const x = /R$/.test(o.pos) ? w-mx-tw : /C$/.test(o.pos) ? (w-tw)/2 : mx;
        const y = /^numT/.test(o.pos) ? h-my : my-o.size*0.2;
        pg.drawText(txt,{x,y,size:o.size,font:F.r,color:PDFLib.rgb(.28,.33,.4)});
      }
    }
    pdf.setProducer("DigiPDF · Digit I&D");
    const bytes = await pdf.save();
    const name = (DOCS.length===1?baseName(DOCS[0].name):"digipdf")+(kind==="wmk"?"-marca":"-numerado")+".pdf";
    dl(new Blob([bytes],{type:"application/pdf"}), name);
    toast(t("okSaved",{f:name}),"ok");
  }catch(e){ console.error(e); toast(t("errBad",{f:"PDF"}),"err"); }
  progOff();
}
